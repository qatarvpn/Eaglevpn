name: Update Mixed Servers

on:
  schedule:
    - cron: "45 * * * *"
  workflow_dispatch:

concurrency:
  group: update-mixed
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:

      # =========================================================
      # 1. Checkout
      # =========================================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # =========================================================
      # 2. Install dependencies + sing-box
      # =========================================================
      - name: Install dependencies
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "Installing dependencies..."
          echo "======================================"

          sudo apt-get update -qq
          sudo apt-get install -y -qq curl jq python3

          VERSION="1.14.2"

          echo "Downloading sing-box ${VERSION}..."

          curl -L --fail \
            --silent \
            --show-error \
            --max-time 60 \
            "https://github.com/SagerNet/sing-box/releases/download/v${VERSION}/sing-box-${VERSION}-linux-amd64.tar.gz" \
            -o /tmp/sing-box.tar.gz

          mkdir -p /tmp/singbox

          tar -xzf \
            /tmp/sing-box.tar.gz \
            -C /tmp/singbox

          SINGBOX_PATH=$(find /tmp/singbox \
            -type f \
            -name sing-box \
            -print \
            -quit)

          if [ -z "$SINGBOX_PATH" ]; then
            echo "ERROR: sing-box binary not found"
            exit 1
          fi

          sudo install -m 755 \
            "$SINGBOX_PATH" \
            /usr/local/bin/sing-box

          echo "sing-box installed:"
          sing-box version

      # =========================================================
      # 3. Download country subscriptions
      # =========================================================
      - name: Download country subscriptions
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "Downloading country subscriptions..."
          echo "======================================"

          mkdir -p /tmp/countries

          curl -L --fail \
            --silent \
            --show-error \
            --max-time 30 \
            "https://api.github.com/repos/Au1rxx/free-vpn-subscriptions/contents/output/by-country" \
            -o /tmp/country-list.json

          jq -r '
            .[]
            | select(.download_url != null)
            | .download_url
          ' /tmp/country-list.json \
            | grep -E 'v2ray-base64-[A-Za-z]{2}\.txt$' \
            | sort -u \
            > /tmp/country-urls.txt

          COUNT=$(wc -l < /tmp/country-urls.txt)

          echo "Country files found: $COUNT"

          if [ "$COUNT" -eq 0 ]; then
            echo "ERROR: No country files found."
            exit 1
          fi

          i=0

          while read -r URL; do

            i=$((i + 1))

            BASENAME=$(basename "$URL")

            echo "Downloading $i/$COUNT: $BASENAME"

            curl -L \
              --fail \
              --silent \
              --show-error \
              --max-time 30 \
              "$URL" \
              -o "/tmp/countries/$BASENAME" || true

          done < /tmp/country-urls.txt

          echo ""
          echo "Downloaded files:"
          ls -lh /tmp/countries

      # =========================================================
      # 4. Parse candidates
      # =========================================================
      - name: Parse candidates
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "Parsing VPN candidates..."
          echo "======================================"

          python3 <<'PY'

          import os
          import re
          import json
          import base64
          import urllib.parse
          import ipaddress

          ROOT = "/tmp/countries"
          OUTPUT = "/tmp/candidates.json"

          PROTOCOLS = {
              "ss": "shadowsocks",
              "hysteria2": "hysteria2",
              "hy2": "hysteria2",
              "trojan": "trojan",
              "vless": "vless",
          }

          COUNTRY_NAMES = {
              "ad": "Andorra",
              "ae": "United Arab Emirates",
              "af": "Afghanistan",
              "al": "Albania",
              "am": "Armenia",
              "ar": "Argentina",
              "at": "Austria",
              "au": "Australia",
              "az": "Azerbaijan",
              "ba": "Bosnia and Herzegovina",
              "bd": "Bangladesh",
              "be": "Belgium",
              "bg": "Bulgaria",
              "bh": "Bahrain",
              "br": "Brazil",
              "by": "Belarus",
              "ca": "Canada",
              "ch": "Switzerland",
              "cl": "Chile",
              "cn": "China",
              "co": "Colombia",
              "cr": "Costa Rica",
              "cy": "Cyprus",
              "cz": "Czech Republic",
              "de": "Germany",
              "dk": "Denmark",
              "do": "Dominican Republic",
              "dz": "Algeria",
              "ec": "Ecuador",
              "ee": "Estonia",
              "eg": "Egypt",
              "es": "Spain",
              "fi": "Finland",
              "fr": "France",
              "gb": "United Kingdom",
              "ge": "Georgia",
              "gr": "Greece",
              "hk": "Hong Kong",
              "hr": "Croatia",
              "hu": "Hungary",
              "id": "Indonesia",
              "ie": "Ireland",
              "il": "Israel",
              "in": "India",
              "iq": "Iraq",
              "is": "Iceland",
              "it": "Italy",
              "jp": "Japan",
              "jo": "Jordan",
              "kr": "South Korea",
              "kw": "Kuwait",
              "kz": "Kazakhstan",
              "la": "Laos",
              "lb": "Lebanon",
              "li": "Liechtenstein",
              "lk": "Sri Lanka",
              "lt": "Lithuania",
              "lu": "Luxembourg",
              "lv": "Latvia",
              "ma": "Morocco",
              "md": "Moldova",
              "me": "Montenegro",
              "mk": "North Macedonia",
              "mn": "Mongolia",
              "mo": "Macau",
              "mt": "Malta",
              "mu": "Mauritius",
              "mx": "Mexico",
              "my": "Malaysia",
              "ng": "Nigeria",
              "nl": "Netherlands",
              "no": "Norway",
              "np": "Nepal",
              "nz": "New Zealand",
              "om": "Oman",
              "pa": "Panama",
              "pe": "Peru",
              "ph": "Philippines",
              "pk": "Pakistan",
              "pl": "Poland",
              "pt": "Portugal",
              "qa": "Qatar",
              "ro": "Romania",
              "rs": "Serbia",
              "ru": "Russia",
              "sa": "Saudi Arabia",
              "se": "Sweden",
              "sg": "Singapore",
              "si": "Slovenia",
              "sk": "Slovakia",
              "th": "Thailand",
              "tr": "Turkey",
              "tw": "Taiwan",
              "ua": "Ukraine",
              "uk": "United Kingdom",
              "us": "United States",
              "uy": "Uruguay",
              "uz": "Uzbekistan",
              "ve": "Venezuela",
              "vn": "Vietnam",
              "za": "South Africa",
          }

          URI_RE = re.compile(
              r'(?:ss|hysteria2|hy2|trojan|vless)://[^\s\r\n<>"\']+',
              re.I
          )

          def normalize_host(host):

              if not host:
                  return None

              host = host.strip().lower().rstrip(".")

              if host.startswith("[") and host.endswith("]"):
                  host = host[1:-1]

              return host

          def get_host(uri):

              try:
                  p = urllib.parse.urlparse(uri)
                  return normalize_host(p.hostname)
              except Exception:
                  return None

          def decode_base64(text):

              text = re.sub(r"\s+", "", text)

              if not text:
                  return ""

              try:
                  padded = text + "=" * (-len(text) % 4)

                  return base64.urlsafe_b64decode(
                      padded
                  ).decode(
                      "utf-8",
                      errors="ignore"
                  )

              except Exception:
                  return ""

          def decode_content(raw):

              raw = raw.strip()

              if not raw:
                  return ""

              # Already contains URI
              if URI_RE.search(raw):
                  return raw

              decoded = decode_base64(raw)

              if URI_RE.search(decoded):
                  return decoded

              # Some feeds contain one Base64 value per line
              output = []

              for line in raw.splitlines():

                  line = line.strip()

                  if not line:
                      continue

                  if URI_RE.match(line):
                      output.append(line)
                      continue

                  value = decode_base64(line)

                  if URI_RE.search(value):
                      output.append(value)

              return "\n".join(output)

          def country_from_filename(filename):

              match = re.search(
                  r'v2ray-base64-([a-zA-Z]{2})\.txt$',
                  filename
              )

              if not match:
                  return "unknown", "Unknown"

              code = match.group(1).lower()

              return code, COUNTRY_NAMES.get(
                  code,
                  code.upper()
              )

          candidates = []

          for filename in sorted(
              os.listdir(ROOT)
          ):

              path = os.path.join(
                  ROOT,
                  filename
              )

              if not os.path.isfile(path):
                  continue

              country_code, country_name = (
                  country_from_filename(filename)
              )

              try:

                  with open(
                      path,
                      "r",
                      encoding="utf-8",
                      errors="ignore"
                  ) as f:

                      raw = f.read()

              except Exception:

                  continue

              decoded = decode_content(raw)

              matches = URI_RE.findall(decoded)

              for uri in matches:

                  uri = uri.strip()

                  try:
                      parsed = urllib.parse.urlparse(uri)
                      scheme = parsed.scheme.lower()
                  except Exception:
                      continue

                  protocol = PROTOCOLS.get(scheme)

                  if not protocol:
                      continue

                  host = get_host(uri)

                  if not host:
                      continue

                  # Ignore malformed ports
                  try:
                      parsed.port
                  except Exception:
                      continue

                  candidates.append({
                      "country": country_name,
                      "countryCode": country_code,
                      "protocol": protocol,
                      "config": uri,
                      "host": host
                  })

          # =====================================================
          # Remove exact duplicate configs
          # =====================================================

          unique = {}
          for item in candidates:

              key = (
                  item["protocol"],
                  item["host"],
                  item["config"]
              )

              unique[key] = item

          candidates = list(unique.values())

          with open(
              OUTPUT,
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  candidates,
                  f,
                  ensure_ascii=False
              )

          print(
              f"Candidates found: {len(candidates)}"
          )

          for protocol in PROTOCOLS.values():

              count = sum(
                  1
                  for x in candidates
                  if x["protocol"] == protocol
              )

              print(
                  f"{protocol}: {count}"
              )

          PY

      # =========================================================
      # 5. Test VPN servers
      # =========================================================
      - name: Test VPN servers
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "Testing VPN servers"
          echo "======================================"

          python3 <<'PY'

          import json
          import subprocess
          import tempfile
          import os
          import time
          import socket
          import threading
          import urllib.parse
          import base64

          from concurrent.futures import (
              ThreadPoolExecutor,
              as_completed
          )

          INPUT = "/tmp/candidates.json"
          OUTPUT = "/tmp/working.json"

          with open(
              INPUT,
              "r",
              encoding="utf-8"
          ) as f:
              candidates = json.load(f)

          print(
              f"Total candidates: {len(candidates)}",
              flush=True
          )

          # =====================================================
          # Global host deduplication BEFORE testing
          # =====================================================

          seen_hosts = set()
          unique = []

          for item in candidates:

              host = item["host"]

              if host in seen_hosts:
                  continue

              seen_hosts.add(host)
              unique.append(item)

          candidates = unique

          print(
              f"Unique hosts: {len(candidates)}",
              flush=True
          )

          # =====================================================
          # Helpers
          # =====================================================

          def query_value(qs, *names):

              for name in names:

                  value = qs.get(name)

                  if value is not None:
                      return value[0]

              return None

          def query_values(qs, name):

              value = qs.get(name)

              if not value:
                  return []

              return [
                  x.strip()
                  for x in value[0].split(",")
                  if x.strip()
              ]

          def bool_value(value):

              if value is None:
                  return False

              return str(value).lower() in (
                  "1",
                  "true",
                  "yes"
              )

          def build_tls(qs, host):

              sni = query_value(
                  qs,
                  "sni",
                  "serverName",
                  "servername"
              )

              insecure = query_value(
                  qs,
                  "allowInsecure",
                  "allowinsecure",
                  "insecure"
              )

              alpn = query_values(
                  qs,
                  "alpn"
              )

              tls = {
                  "enabled": True
              }

              if sni:
                  tls["server_name"] = sni

              if insecure is not None:
                  tls["insecure"] = bool_value(
                      insecure
                  )

              if alpn:
                  tls["alpn"] = alpn

              fingerprint = query_value(
                  qs,
                  "fp",
                  "fingerprint"
              )

              if fingerprint:
                  tls["utls"] = {
                      "enabled": True,
                      "fingerprint": fingerprint
                  }

              return tls

          def build_transport(qs):

              network = query_value(
                  qs,
                  "type",
                  "network"
              )

              if not network:
                  return None

              network = network.lower()

              # WebSocket
              if network == "ws":

                  transport = {
                      "type": "ws"
                  }

                  path = query_value(
                      qs,
                      "path"
                  )

                  host = query_value(
                      qs,
                      "host",
                      "authority"
                  )

                  if path:
                      transport["path"] = (
                          urllib.parse.unquote(path)
                      )

                  if host:
                      transport["headers"] = {
                          "Host": host
                      }

                  return transport

              # gRPC
              if network == "grpc":

                  transport = {
                      "type": "grpc"
                  }

                  service = query_value(
                      qs,
                      "serviceName",
                      "servicename",
                      "service"
                  )

                  if service:
                      transport["service_name"] = service

                  mode = query_value(
                      qs,
                      "mode"
                  )

                  if mode:
                      transport["idle_session_check_interval"] = (
                          "15s"
                      )

                  return transport

              # HTTP Upgrade
              if network in (
                  "httpupgrade",
                  "http-upgrade"
              ):

                  transport = {
                      "type": "httpupgrade"
                  }

                  path = query_value(
                      qs,
                      "path"
                  )

                  host = query_value(
                      qs,
                      "host"
                  )

                  if path:
                      transport["path"] = (
                          urllib.parse.unquote(path)
                      )

                  if host:
                      transport["host"] = host

                  return transport

              return None

          def parse_ss(uri):

              data = uri[5:]

              # SIP002:
              # ss://BASE64(method:password)@host:port
              # or
              # ss://method:password@host:port

              parsed = urllib.parse.urlparse(uri)

              if parsed.hostname:

                  userinfo = parsed.username or ""

                  if userinfo:

                      decoded_userinfo = (
                          urllib.parse.unquote(
                              userinfo
                          )
                      )

                      if ":" in decoded_userinfo:

                          method, password = (
                              decoded_userinfo.split(
                                  ":",
                                  1
                              )
                          )

                          return {
                              "type": "shadowsocks",
                              "tag": "proxy",
                              "server": parsed.hostname,
                              "server_port": parsed.port or 443,
                              "method": method,
                              "password": urllib.parse.unquote(
                                  password
                              )
                          }

              # Legacy base64
              raw = data.split("#", 1)[0]

              if "@" not in raw:

                  decoded = ""

                  try:

                      padding = "=" * (
                          -len(raw) % 4
                      )

                      decoded = (
                          base64.urlsafe_b64decode(
                              raw + padding
                          )
                          .decode(
                              "utf-8",
                              errors="ignore"
                          )
                      )

                  except Exception:
                      pass

                  raw = decoded

              if "@" not in raw:
                  return None

              userinfo, address = raw.rsplit(
                  "@",
                  1
              )

              if ":" not in userinfo:
                  return None

              method, password = userinfo.split(
                  ":",
                  1
              )

              if address.startswith("["):

                  end = address.find("]")

                  if end == -1:
                      return None

                  host = address[
                      1:end
                  ]

                  rest = address[
                      end + 1:
                  ]

                  if not rest.startswith(":"):
                      return None

                  port = int(
                      rest[1:]
                  )

              else:

                  host, port_text = (
                      address.rsplit(
                          ":",
                          1
                      )
                  )

                  port = int(
                      port_text
                  )

              return {
                  "type": "shadowsocks",
                  "tag": "proxy",
                  "server": host,
                  "server_port": port,
                  "method": method,
                  "password": password
              }

          def parse_uri(uri):

              parsed = urllib.parse.urlparse(
                  uri
              )

              scheme = parsed.scheme.lower()

              qs = urllib.parse.parse_qs(
                  parsed.query,
                  keep_blank_values=True
              )

              host = parsed.hostname

              if not host:
                  return None

              port = parsed.port or 443

              # =================================================
              # Shadowsocks
              # =================================================

              if scheme == "ss":

                  return parse_ss(uri)

              # =================================================
              # Trojan
              # =================================================

              if scheme == "trojan":

                  password = urllib.parse.unquote(
                      parsed.username or ""
                  )

                  if not password:
                      return None

                  outbound = {
                      "type": "trojan",
                      "tag": "proxy",
                      "server": host,
                      "server_port": port,
                      "password": password
                  }

                  tls = build_tls(
                      qs,
                      host
                  )

                  outbound["tls"] = tls

                  transport = build_transport(
                      qs
                  )

                  if transport:
                      outbound["transport"] = transport

                  return outbound

              # =================================================
              # Hysteria2
              # =================================================

              if scheme in (
                  "hysteria2",
                  "hy2"
              ):

                  password = urllib.parse.unquote(
                      parsed.username or ""
                  )

                  if not password:
                      return None

                  outbound = {
                      "type": "hysteria2",
                      "tag": "proxy",
                      "server": host,
                      "server_port": port,
                      "password": password
                  }

                  tls = build_tls(
                      qs,
                      host
                  )

                  outbound["tls"] = tls

                  obfs_type = query_value(
                      qs,
                      "obfs"
                  )

                  obfs_password = query_value(
                      qs,
                      "obfs-password",
                      "obfs_password"
                  )

                  if obfs_type:

                      obfs = {
                          "type": obfs_type
                      }

                      if obfs_password:
                          obfs["password"] = (
                              obfs_password
                          )

                      outbound["obfs"] = obfs

                  hop_interval = query_value(
                      qs,
                      "hop-interval"
                  )

                  if hop_interval:
                      outbound[
                          "hop_interval"
                      ] = hop_interval

                  return outbound

              # =================================================
              # VLESS
              # =================================================

              if scheme == "vless":

                  uuid = urllib.parse.unquote(
                      parsed.username or ""
                  )

                  if not uuid:
                      return None

                  outbound = {
                      "type": "vless",
                      "tag": "proxy",
                      "server": host,
                      "server_port": port,
                      "uuid": uuid
                  }

                  flow = query_value(
                      qs,
                      "flow"
                  )

                  if flow:
                      outbound["flow"] = flow

                  packet_encoding = query_value(
                      qs,
                      "packetEncoding",
                      "packet_encoding"
                  )

                  if packet_encoding:
                      outbound[
                          "packet_encoding"
                      ] = packet_encoding

                  network = query_value(
                      qs,
                      "type",
                      "network"
                  )

                  if network:
                      outbound[
                          "network"
                      ] = network

                  # TLS
                  security = query_value(
                      qs,
                      "security"
                  )

                  if security in (
                      "tls",
                      "reality"
                  ):

                      tls = build_tls(
                          qs,
                          host
                      )

                      # Reality
                      if security == "reality":

                          public_key = query_value(
                              qs,
                              "pbk",
                              "publicKey",
                              "public-key"
                          )

                          short_id = query_value(
                              qs,
                              "sid",
                              "shortId",
                              "short-id"
                          )

                          reality = {}

                          if public_key:
                              reality[
                                  "public_key"
                              ] = public_key

                          if short_id:
                              reality[
                                  "short_id"
                              ] = short_id

                          if reality:
                              tls["reality"] = reality

                      outbound["tls"] = tls

                  transport = build_transport(
                      qs
                  )

                  if transport:
                      outbound[
                          "transport"
                      ] = transport

                  return outbound

              return None

          # =====================================================
          # Test one server
          # =====================================================

          def free_port():

              s = socket.socket(
                  socket.AF_INET,
                  socket.SOCK_STREAM
              )

              s.bind(
                  ("127.0.0.1", 0)
              )

              port = s.getsockname()[1]

              s.close()

              return port

          def test(item):

              process = None
              conf_path = None

              try:

                  outbound = parse_uri(
                      item["config"]
                  )

                  if not outbound:
                      return None

                  port = free_port()

                  config = {
                      "log": {
                          "level": "error"
                      },

                      "dns": {
                          "servers": [
                              {
                                  "type": "local"
                              }
                          ]
                      },

                      "inbounds": [
                          {
                              "type": "mixed",
                              "tag": "mixed-in",
                              "listen": "127.0.0.1",
                              "listen_port": port
                          }
                      ],

                      "outbounds": [
                          outbound
                      ]
                  }

                  with tempfile.NamedTemporaryFile(
                      mode="w",
                      suffix=".json",
                      delete=False,
                      encoding="utf-8"
                  ) as f:

                      json.dump(
                          config,
                          f,
                          ensure_ascii=False
                      )

                      conf_path = f.name

                  # Validate configuration
                  check = subprocess.run(
                      [
                          "sing-box",
                          "check",
                          "-c",
                          conf_path
                      ],
                      stdout=subprocess.DEVNULL,
                      stderr=subprocess.DEVNULL,
                      timeout=5
                  )

                  if check.returncode != 0:
                      return None

                  # Start sing-box
                  process = subprocess.Popen(
                      [
                          "sing-box",
                          "run",
                          "-c",
                          conf_path
                      ],
                      stdout=subprocess.DEVNULL,
                      stderr=subprocess.DEVNULL
                  )

                  # Wait for local proxy
                  ready = False

                  for _ in range(20):

                      if process.poll() is not None:
                          return None

                      try:

                          sock = socket.create_connection(
                              (
                                  "127.0.0.1",
                                  port
                              ),
                              timeout=0.2
                          )

                          sock.close()

                          ready = True
                          break

                      except Exception:
                          time.sleep(0.1)

                  if not ready:
                      return None

                  # Real HTTPS request through proxy
                  start = time.monotonic()

                  result = subprocess.run(
                      [
                          "curl",
                          "--silent",
                          "--show-error",
                          "--connect-timeout",
                          "2",
                          "--max-time",
                          "5",
                          "--socks5-hostname",
                          f"127.0.0.1:{port}",
                          "https://cp.cloudflare.com/generate_204",
                          "-o",
                          "/dev/null",
                          "-w",
                          "%{http_code}"
                      ],
                      stdout=subprocess.PIPE,
                      stderr=subprocess.DEVNULL,
                      text=True,
                      timeout=6
                  )

                  latency = int(
                      (
                          time.monotonic()
                          - start
                      ) * 1000
                  )

                  if (
                      result.returncode == 0
                      and result.stdout.strip() == "204"
                  ):

                      result_item = dict(item)

                      result_item[
                          "latency_ms"
                      ] = latency

                      return result_item

                  return None

              except Exception:

                  return None

              finally:

                  if process is not None:

                      try:
                          process.kill()
                      except Exception:
                          pass

                      try:
                          process.wait(
                              timeout=1
                          )
                      except Exception:
                          pass

                  if conf_path:

                      try:
                          os.unlink(
                              conf_path
                          )
                      except Exception:
                          pass

          # =====================================================
          # Parallel testing
          # =====================================================

          MAX_WORKERS = 8

          print(
              f"Starting {MAX_WORKERS} parallel tests...",
              flush=True
          )

          results = []

          completed = 0
          working = 0
          total = len(candidates)

          with ThreadPoolExecutor(
              max_workers=MAX_WORKERS
          ) as executor:

              futures = [
                  executor.submit(
                      test,
                      item
                  )
                  for item in candidates
              ]

              for future in as_completed(
                  futures
              ):

                  completed += 1

                  try:
                      result = future.result()
                  except Exception:
                      result = None

                  if result:

                      results.append(
                          result
                      )

                      working += 1

                  if (
                      completed % 5 == 0
                      or completed == total
                  ):

                      print(
                          f"Progress: "
                          f"{completed}/{total} | "
                          f"Working: {working}",
                          flush=True
                      )

          # =====================================================
          # Sort fastest first
          # =====================================================

          results.sort(
              key=lambda x: x.get(
                  "latency_ms",
                  999999
              )
          )

          with open(
              OUTPUT,
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  results,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print("")
          print(
              f"Working servers: {len(results)}",
              flush=True
          )

          for protocol in (
              "shadowsocks",
              "hysteria2",
              "trojan",
              "vless"
          ):

              count = sum(
                  1
                  for x in results
                  if x["protocol"] == protocol
              )

              print(
                  f"{protocol}: {count}",
                  flush=True
              )

          PY

      # =========================================================
      # 6. Select 20 per protocol
      # =========================================================
      - name: Build final services.json
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "Building final services.json..."
          echo "======================================"

          python3 <<'PY'

          import json
          import sys

          INPUT = "/tmp/working.json"
          OUTPUT = "services.json"

          REQUIRED = {
              "shadowsocks": 20,
              "hysteria2": 20,
              "trojan": 20,
              "vless": 20
          }

          with open(
              INPUT,
              "r",
              encoding="utf-8"
          ) as f:

              servers = json.load(f)

          # =====================================================
          # Group by protocol
          # =====================================================

          groups = {
              protocol: []
              for protocol in REQUIRED
          }

          for item in servers:

              protocol = item["protocol"]

              if protocol in groups:

                  groups[protocol].append(
                      item
                  )

          # Fastest first
          for protocol in groups:

              groups[protocol].sort(
                  key=lambda x: x.get(
                      "latency_ms",
                      999999
                  )
              )

          print("")
          print("Available working servers:")
          print("")

          for protocol in REQUIRED:

              print(
                  f"{protocol}: "
                  f"{len(groups[protocol])}"
              )

          print("")

          # =====================================================
          # Validate availability first
          # =====================================================

          for protocol, required in REQUIRED.items():

              if len(
                  groups[protocol]
              ) < required:

                  print(
                      f"ERROR: Only "
                      f"{len(groups[protocol])} "
                      f"working {protocol} servers."
                  )

                  print(
                      f"Required: {required}"
                  )

                  sys.exit(1)

          # =====================================================
          # Select with GLOBAL host deduplication
          # =====================================================

          selected = {
              protocol: []
              for protocol in REQUIRED
          }

          used_hosts = set()

          # Round-robin protocols.
          # This prevents one protocol from consuming
          # too many shared hosts before the others.
          remaining = True

          while remaining:

              remaining = False

              for protocol in REQUIRED:

                  if len(
                      selected[protocol]
                  ) >= REQUIRED[protocol]:

                      continue

                  for item in groups[protocol]:

                      host = item["host"]

                      if host in used_hosts:
                          continue

                      used_hosts.add(host)

                      selected[protocol].append(
                          item
                      )

                      break

                  if len(
                      selected[protocol]
                  ) < REQUIRED[protocol]:

                      remaining = True

          # =====================================================
          # Final protocol validation
          # =====================================================

          print("")
          print("Final selection:")
          print("")

          total = 0

          for protocol, required in REQUIRED.items():

              count = len(
                  selected[protocol]
              )

              print(
                  f"{protocol}: "
                  f"{count}/{required}"
              )

              total += count

              if count != required:

                  print("")
                  print(
                      "ERROR: Could not build "
                      "80 unique servers."
                  )

                  print(
                      "The workflow will NOT publish "
                      "an incomplete list."
                  )

                  sys.exit(1)

          if total != 80:

              print(
                  f"ERROR: Expected 80, got {total}"
              )

              sys.exit(1)

          # =====================================================
          # Build output
          # =====================================================

          final = []

          for protocol in REQUIRED:

              for item in selected[protocol]:

                  final.append({
                      "name": "",
                      "config": item["config"],
                      "countryCode": item["countryCode"],
                      "_country": item["country"],
                      "_protocol": protocol,
                      "_latency": item.get(
                          "latency_ms",
                          999999
                      )
                  })

          # =====================================================
          # Sort by country first
          # =====================================================

          final.sort(
              key=lambda x: (
                  x["_country"].lower(),
                  x["_latency"],
                  x["_protocol"]
              )
          )

          # =====================================================
          # Number sequentially INSIDE each country
          # across ALL protocols
          # =====================================================

          counters = {}

          for item in final:

              country = item["_country"]

              counters[country] = (
                  counters.get(
                      country,
                      0
                  ) + 1
              )

              item["name"] = (
                  f"{country} "
                  f"{counters[country]}"
              )

          # =====================================================
          # Remove internal fields
          # =====================================================

          output = []

          for item in final:

              output.append({
                  "name": item["name"],
                  "config": item["config"],
                  "countryCode": item["countryCode"]
              })

          # =====================================================
          # Final duplicate check
          # =====================================================

          hosts = set()

          for item in final:

              host = item["host"]

              if host in hosts:

                  print(
                      "ERROR: Duplicate host:",
                      host
                  )

                  sys.exit(1)

              hosts.add(host)

          # =====================================================
          # Write JSON
          # =====================================================

          with open(
              OUTPUT,
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  output,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print("")
          print(
              "Successfully created services.json"
          )

          print(
              f"Total servers: {len(output)}"
          )

          print("")
          print("Final servers:")
          print("")

          current_country = None

          for item in output:

              if item["countryCode"] != current_country:

                  current_country = (
                      item["countryCode"]
                  )

                  print(
                      f"[{item['name'].rsplit(' ', 1)[0]}]"
                  )

              print(
                  f"  {item['name']}"
              )

          PY

      # =========================================================
      # 7. Show final JSON
      # =========================================================
      - name: Show services.json
        shell: bash
        run: |
          echo "======================================"
          echo "FINAL services.json"
          echo "======================================"

          cat services.json

      # =========================================================
      # 8. Commit
      # =========================================================
      - name: Commit changes
        shell: bash
        run: |
          set -e

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add services.json

          if git diff --cached --quiet; then

            echo "No changes."

            exit 0

          fi

          git commit \
            -m "Update mixed VPN servers"

      # =========================================================
      # 9. Push
      # =========================================================
      - name: Push changes
        shell: bash
        run: |
          set -e

          for i in 1 2 3; do

            echo "Push attempt $i..."

            git pull \
              --rebase \
              origin main || true

            if git push \
              origin HEAD:main; then

              echo "Push successful."

              exit 0

            fi

            sleep 3

          done

          echo "ERROR: Failed to push."

          exit 1
