name: Update Mixed VPN Servers

on:
  schedule:
    - cron: "45 * * * *"
  workflow_dispatch:

concurrency:
  group: update-mixed
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download country subscriptions
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          mkdir -p /tmp/vpn_sources

          echo "Fetching country files..."

          curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/Au1rxx/free-vpn-subscriptions/contents/output/by-country" \
            -o /tmp/files.json

          python - <<'PY'
          import json
          import os
          import urllib.request

          API_FILE = "/tmp/files.json"
          OUT_DIR = "/tmp/vpn_sources"

          with open(API_FILE, "r", encoding="utf-8") as f:
              files = json.load(f)

          downloaded = 0

          for item in files:
              filename = item.get("name", "")

              if not filename.startswith("v2ray-base64-"):
                  continue

              if not filename.endswith(".txt"):
                  continue

              country = filename[len("v2ray-base64-"):-len(".txt")].lower()

              if not country:
                  continue

              url = item.get("download_url")

              if not url:
                  continue

              output = os.path.join(OUT_DIR, f"{country}.txt")

              print(f"Downloading: {filename}")
              urllib.request.urlretrieve(url, output)
              downloaded += 1

          print(f"Downloaded {downloaded} country files.")

          if downloaded == 0:
              raise SystemExit("No country subscription files found.")
          PY

      - name: Install sing-box (real proxy client used for testing)
        shell: bash
        run: |
          set -e

          SB_VERSION="1.12.0"

          curl -fsSL \
            "https://github.com/SagerNet/sing-box/releases/download/v${SB_VERSION}/sing-box-${SB_VERSION}-linux-amd64.tar.gz" \
            -o /tmp/sing-box.tar.gz

          tar -xzf /tmp/sing-box.tar.gz -C /tmp

          sudo install -m 755 \
            "/tmp/sing-box-${SB_VERSION}-linux-amd64/sing-box" \
            /usr/local/bin/sing-box

          sing-box version

      - name: Collect candidate servers
        shell: bash
        run: |
          set -e

          python - <<'PY'
          import base64
          import ipaddress
          import json
          import os
          import random
          import re
          from urllib.parse import urlsplit

          SOURCE_DIR = "/tmp/vpn_sources"
          OUTPUT = "/tmp/candidates.json"

          # How many candidates per protocol are tested for real.
          # Only 20 per protocol are finally kept, so we test more
          # than needed to compensate for dead servers.
          MAX_CANDIDATES = 200

          PROTOCOLS = ("ss", "hysteria2", "trojan", "vless")

          def decode_subscription(text):
              text = text.strip()

              if not text:
                  return []

              plain_lines = [l.strip() for l in text.splitlines() if l.strip()]

              if any(
                  l.lower().startswith(
                      ("ss://", "hysteria2://", "hy2://", "trojan://", "vless://")
                  )
                  for l in plain_lines
              ):
                  return plain_lines

              compact = re.sub(r"\s+", "", text)
              padding = "=" * (-len(compact) % 4)

              for decoder in (base64.b64decode, base64.urlsafe_b64decode):
                  try:
                      decoded = decoder(compact + padding).decode(
                          "utf-8", errors="ignore"
                      )
                      lines = [l.strip() for l in decoded.splitlines() if l.strip()]
                      if lines:
                          return lines
                  except Exception:
                      pass

              return []

          def get_protocol(uri):
              lower = uri.lower()

              if lower.startswith("ss://"):
                  return "ss"
              if lower.startswith("hysteria2://") or lower.startswith("hy2://"):
                  return "hysteria2"
              if lower.startswith("trojan://"):
                  return "trojan"
              if lower.startswith("vless://"):
                  return "vless"

              return None

          def normalize_host(host):
              if not host:
                  return None

              host = str(host).strip()

              if host.startswith("[") and host.endswith("]"):
                  host = host[1:-1]

              host = host.rstrip(".")

              if not host:
                  return None

              try:
                  return str(ipaddress.ip_address(host))
              except ValueError:
                  pass

              return host.lower()

          def decode_ss_host(uri):
              try:
                  parsed = urlsplit(uri)

                  if parsed.hostname:
                      return parsed.hostname

                  netloc = parsed.netloc

                  if "@" not in netloc:
                      return None

                  encoded = netloc.split("@", 1)[0]
                  padding = "=" * (-len(encoded) % 4)

                  decoded = base64.urlsafe_b64decode(encoded + padding).decode(
                      "utf-8", errors="ignore"
                  )

                  if "@" in decoded:
                      endpoint = decoded.rsplit("@", 1)[1]

                      if ":" in endpoint:
                          return endpoint.rsplit(":", 1)[0]

              except Exception:
                  pass

              return None

          def get_server_host(uri):
              protocol = get_protocol(uri)

              if protocol == "ss":
                  host = decode_ss_host(uri)
                  return normalize_host(host) if host else None

              try:
                  host = urlsplit(uri).hostname
                  if host:
                      return normalize_host(host)
              except Exception:
                  pass

              return None

          pools = {p: [] for p in PROTOCOLS}
          seen_configs = {p: set() for p in PROTOCOLS}

          files = sorted(f for f in os.listdir(SOURCE_DIR) if f.endswith(".txt"))
          print(f"Found {len(files)} country files.")

          for filename in files:
              country = filename[:-4].lower()
              path = os.path.join(SOURCE_DIR, filename)

              try:
                  with open(path, "r", encoding="utf-8", errors="ignore") as f:
                      raw = f.read()
              except Exception as e:
                  print(f"Failed reading {filename}: {e}")
                  continue

              for line in decode_subscription(raw):
                  uri = line.strip().replace("\r", "").replace("\n", "")

                  if not uri:
                      continue

                  protocol = get_protocol(uri)

                  if protocol is None or uri in seen_configs[protocol]:
                      continue

                  host = get_server_host(uri)

                  if not host:
                      continue

                  seen_configs[protocol].add(uri)

                  pools[protocol].append({
                      "protocol": protocol,
                      "config": uri,
                      "countryCode": country,
                      "host": host,
                  })

          candidates = []

          for protocol in PROTOCOLS:
              items = pools[protocol]
              random.shuffle(items)
              print(f"{protocol:10s}: {len(items)} available, testing {min(len(items), MAX_CANDIDATES)}")
              candidates.extend(items[:MAX_CANDIDATES])

          with open(OUTPUT, "w", encoding="utf-8") as f:
              json.dump(candidates, f, ensure_ascii=False)

          print(f"Total candidates to test: {len(candidates)}")
          PY

      - name: Test servers with a real proxy connection and generate services.json
        shell: bash
        run: |
          set -e

          python - <<'PY'
          import base64
          import json
          import os
          import re
          import shutil
          import socket
          import subprocess
          import tempfile
          import time
          from concurrent.futures import ThreadPoolExecutor
          from urllib.parse import parse_qs, unquote

          CANDIDATES = "/tmp/candidates.json"
          OUTPUT = "services.json"
          SING_BOX = "/usr/local/bin/sing-box"

          TARGET_PER_PROTOCOL = 20
          PROTOCOLS = ("ss", "hysteria2", "trojan", "vless")

          WORKERS = 40
          BASE_PORT = 20000
          CURL_TIMEOUT = 10

          # A server is "working" only if real traffic passes through it:
          #  1) HTTPS request through the proxy returns 204 on two
          #     independent endpoints.
          #  2) The public IP seen through the proxy is a valid IP and
          #     is DIFFERENT from the runner's own IP.
          GENERATE_204_URLS = (
              "https://www.gstatic.com/generate_204",
              "https://cp.cloudflare.com/generate_204",
          )
          IP_ECHO_URLS = (
              "https://api.ipify.org",
              "https://ifconfig.me/ip",
          )

          COUNTRY_NAMES = {
              "us": "United States", "gb": "United Kingdom", "ca": "Canada",
              "de": "Germany", "fr": "France", "nl": "Netherlands",
              "jp": "Japan", "sg": "Singapore", "hk": "Hong Kong",
              "kr": "South Korea", "tw": "Taiwan", "in": "India",
              "ae": "United Arab Emirates", "au": "Australia", "es": "Spain",
              "it": "Italy", "pl": "Poland", "se": "Sweden", "fi": "Finland",
              "ro": "Romania", "id": "Indonesia", "my": "Malaysia",
              "th": "Thailand", "vn": "Vietnam", "br": "Brazil",
              "mx": "Mexico", "ch": "Switzerland", "at": "Austria",
              "be": "Belgium", "dk": "Denmark", "no": "Norway",
              "cz": "Czech Republic", "ua": "Ukraine", "tr": "Turkey",
              "ru": "Russia", "il": "Israel", "za": "South Africa",
              "pt": "Portugal", "gr": "Greece", "ie": "Ireland",
              "nz": "New Zealand", "ph": "Philippines", "pk": "Pakistan",
              "bd": "Bangladesh", "ar": "Argentina", "cl": "Chile",
              "co": "Colombia", "pe": "Peru",
          }

          IP_RE = re.compile(r"^(\d{1,3}(\.\d{1,3}){3}|[0-9a-fA-F:]{3,45})$")

          # ------------------------------------------------------------
          # URI -> sing-box outbound
          # ------------------------------------------------------------

          def b64d(s):
              s = s.strip().replace("-", "+").replace("_", "/")
              s += "=" * (-len(s) % 4)
              return base64.b64decode(s).decode("utf-8", errors="ignore")

          def truthy(v):
              return str(v).lower() in ("1", "true", "yes")

          def parse_hostport(hp):
              hp = hp.strip().rstrip("/")

              m = re.match(r"^\[([^\]]+)\](?::(\d+))?", hp)
              if m:
                  return m.group(1), int(m.group(2) or 443)

              host, _, port = hp.rpartition(":")

              if not host:
                  return hp, 443

              m = re.match(r"\d+", port)
              return host, int(m.group(0)) if m else 443

          def split_uri(uri):
              scheme, _, rest = uri.partition("://")
              rest, _, _frag = rest.partition("#")
              rest, _, query = rest.partition("?")

              userinfo, at, hostport = rest.rpartition("@")
              if not at:
                  userinfo, hostport = "", rest

              hostport = hostport.split("/")[0]
              q = {k: v[0] for k, v in parse_qs(query).items()}

              return scheme.lower(), unquote(userinfo), hostport, q

          def build_tls(q, host, default_on):
              sec = (q.get("security") or ("tls" if default_on else "none")).lower()

              if sec in ("", "none"):
                  return None

              if sec not in ("tls", "reality", "xtls"):
                  raise ValueError("unsupported security")

              tls = {
                  "enabled": True,
                  "server_name": q.get("sni") or q.get("peer") or q.get("host") or host,
              }

              if truthy(q.get("allowInsecure", "0")) or truthy(q.get("insecure", "0")):
                  tls["insecure"] = True

              if q.get("alpn"):
                  alpn = [a for a in unquote(q["alpn"]).split(",") if a]
                  if alpn:
                      tls["alpn"] = alpn

              fp = q.get("fp")

              if sec == "reality":
                  if not q.get("pbk"):
                      raise ValueError("reality without public key")

                  tls["reality"] = {
                      "enabled": True,
                      "public_key": q["pbk"],
                      "short_id": q.get("sid", ""),
                  }
                  fp = fp or "chrome"

              if fp:
                  tls["utls"] = {"enabled": True, "fingerprint": fp}

              return tls

          def build_transport(q):
              t = (q.get("type") or "tcp").lower()
              path = unquote(q.get("path", ""))
              host_header = q.get("host", "")

              if t == "tcp":
                  if (q.get("headerType") or "none").lower() not in ("none", ""):
                      raise ValueError("tcp http header obfs unsupported")
                  return None

              if t == "ws":
                  tr = {"type": "ws", "path": path or "/"}
                  if host_header:
                      tr["headers"] = {"Host": host_header}
                  return tr

              if t == "grpc":
                  return {
                      "type": "grpc",
                      "service_name": q.get("serviceName") or path.strip("/"),
                  }

              if t in ("http", "h2"):
                  tr = {"type": "http", "path": path or "/"}
                  if host_header:
                      tr["host"] = [h for h in host_header.split(",") if h]
                  return tr

              if t == "httpupgrade":
                  tr = {"type": "httpupgrade", "path": path or "/"}
                  if host_header:
                      tr["host"] = host_header
                  return tr

              raise ValueError(f"unsupported transport {t}")

          def build_vless(uri):
              _, uuid, hp, q = split_uri(uri)
              host, port = parse_hostport(hp)

              if (q.get("encryption") or "none").lower() not in ("none", ""):
                  raise ValueError("vless encryption unsupported")

              ob = {
                  "type": "vless",
                  "tag": "proxy",
                  "server": host,
                  "server_port": port,
                  "uuid": uuid,
              }

              if q.get("flow"):
                  ob["flow"] = q["flow"]
              else:
                  ob["packet_encoding"] = "xudp"

              tls = build_tls(q, host, False)
              if tls:
                  ob["tls"] = tls

              tr = build_transport(q)
              if tr:
                  ob["transport"] = tr

              return ob

          def build_trojan(uri):
              _, password, hp, q = split_uri(uri)
              host, port = parse_hostport(hp)

              ob = {
                  "type": "trojan",
                  "tag": "proxy",
                  "server": host,
                  "server_port": port,
                  "password": password,
              }

              tls = build_tls(q, host, True)
              if tls:
                  ob["tls"] = tls

              tr = build_transport(q)
              if tr:
                  ob["transport"] = tr

              return ob

          def build_hysteria2(uri):
              _, auth, hp, q = split_uri(uri)
              host, port = parse_hostport(hp)

              tls = {
                  "enabled": True,
                  "server_name": q.get("sni") or host,
                  "alpn": ["h3"],
              }

              if truthy(q.get("insecure", "0")) or truthy(q.get("allowInsecure", "0")):
                  tls["insecure"] = True

              ob = {
                  "type": "hysteria2",
                  "tag": "proxy",
                  "server": host,
                  "server_port": port,
                  "password": auth,
                  "tls": tls,
              }

              obfs = q.get("obfs")

              if obfs:
                  if obfs != "salamander":
                      raise ValueError("unsupported hysteria2 obfs")
                  ob["obfs"] = {
                      "type": "salamander",
                      "password": q.get("obfs-password", ""),
                  }

              return ob

          def build_ss(uri):
              body = uri[5:].split("#", 1)[0]
              body, _, query = body.partition("?")
              q = {k: v[0] for k, v in parse_qs(query).items()}

              if q.get("plugin"):
                  raise ValueError("ss plugin unsupported")

              body = body.rstrip("/")

              if "@" in body:
                  userinfo, hostport = body.rsplit("@", 1)
                  userinfo = unquote(userinfo)
                  if ":" not in userinfo:
                      userinfo = b64d(userinfo)
              else:
                  decoded = b64d(unquote(body))
                  if "@" not in decoded:
                      raise ValueError("bad ss uri")
                  userinfo, hostport = decoded.rsplit("@", 1)

              method, _, password = userinfo.partition(":")

              if not method or not password:
                  raise ValueError("bad ss credentials")

              host, port = parse_hostport(hostport)

              return {
                  "type": "shadowsocks",
                  "tag": "proxy",
                  "server": host,
                  "server_port": port,
                  "method": method,
                  "password": password,
              }

          BUILDERS = {
              "ss": build_ss,
              "hysteria2": build_hysteria2,
              "trojan": build_trojan,
              "vless": build_vless,
          }

          # ------------------------------------------------------------
          # Real connectivity test
          # ------------------------------------------------------------

          def curl(url, port=None, write_out=None):
              cmd = [
                  "curl", "-sS",
                  "--connect-timeout", "8",
                  "--max-time", str(CURL_TIMEOUT),
              ]

              if port:
                  cmd += ["--socks5-hostname", f"127.0.0.1:{port}"]

              if write_out:
                  cmd += ["-o", "/dev/null", "-w", write_out]

              cmd.append(url)

              r = subprocess.run(cmd, capture_output=True, text=True)

              if r.returncode != 0:
                  return None

              return r.stdout.strip()

          def get_ip(port=None):
              for url in IP_ECHO_URLS:
                  out = curl(url, port)
                  if out and IP_RE.match(out):
                      return out
              return None

          DIRECT_IP = get_ip()
          print(f"Runner direct IP: {DIRECT_IP}")

          WORK = tempfile.mkdtemp(prefix="sb_")

          def test_server(args):
              idx, item = args
              port = BASE_PORT + idx

              try:
                  outbound = BUILDERS[item["protocol"]](item["config"])
              except Exception as e:
                  return None, "unsupported"

              d = os.path.join(WORK, str(idx))
              os.makedirs(d, exist_ok=True)
              cfg_path = os.path.join(d, "config.json")

              cfg = {
                  "log": {"level": "error"},
                  "inbounds": [{
                      "type": "socks",
                      "tag": "in",
                      "listen": "127.0.0.1",
                      "listen_port": port,
                  }],
                  "outbounds": [outbound, {"type": "direct", "tag": "direct"}],
                  "route": {"final": "proxy"},
              }

              with open(cfg_path, "w", encoding="utf-8") as f:
                  json.dump(cfg, f)

              env = dict(os.environ)
              env["ENABLE_DEPRECATED_MISSING_DOMAIN_RESOLVER"] = "true"

              proc = subprocess.Popen(
                  [SING_BOX, "run", "-c", cfg_path],
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL,
                  env=env,
              )

              try:
                  ready = False

                  for _ in range(40):
                      if proc.poll() is not None:
                          return None, "bad-config"

                      try:
                          socket.create_connection(("127.0.0.1", port), 0.25).close()
                          ready = True
                          break
                      except OSError:
                          time.sleep(0.15)

                  if not ready:
                      return None, "core-not-ready"

                  times = []

                  for url in GENERATE_204_URLS:
                      out = curl(url, port, "%{http_code} %{time_total}")

                      if not out:
                          return None, "no-traffic"

                      code, _, t = out.partition(" ")

                      if code != "204":
                          return None, f"http-{code}"

                      times.append(float(t))

                  ip = get_ip(port)

                  if not ip:
                      return None, "no-ip-echo"

                  if DIRECT_IP and ip == DIRECT_IP:
                      return None, "traffic-not-proxied"

                  return round(sum(times) / len(times) * 1000), "ok"

              except Exception as e:
                  return None, f"error"

              finally:
                  proc.terminate()
                  try:
                      proc.wait(timeout=3)
                  except Exception:
                      proc.kill()

          with open(CANDIDATES, "r", encoding="utf-8") as f:
              candidates = json.load(f)

          print(f"Testing {len(candidates)} candidates with {WORKERS} workers...")

          started = time.time()

          with ThreadPoolExecutor(max_workers=WORKERS) as ex:
              results = list(ex.map(test_server, enumerate(candidates)))

          shutil.rmtree(WORK, ignore_errors=True)

          print(f"Testing finished in {time.time() - started:.0f}s")

          working = {p: [] for p in PROTOCOLS}
          stats = {p: {} for p in PROTOCOLS}

          for item, (latency, reason) in zip(candidates, results):
              p = item["protocol"]
              stats[p][reason] = stats[p].get(reason, 0) + 1

              if reason == "ok":
                  item["latency"] = latency
                  working[p].append(item)

          print("")
          print("==============================")
          for p in PROTOCOLS:
              print(f"{p:10s} working={len(working[p])}  details={stats[p]}")
          print("==============================")
          print("")

          # ------------------------------------------------------------
          # Selection: only WORKING servers, one host used once globally.
          # ------------------------------------------------------------

          host_protocols = {}

          for p in PROTOCOLS:
              for item in working[p]:
                  host_protocols.setdefault(item["host"], set()).add(p)

          for p in PROTOCOLS:
              working[p].sort(
                  key=lambda i: (
                      len(host_protocols[i["host"]]),
                      i["latency"],
                      i["host"],
                  )
              )

          seen_hosts = set()
          selected = {p: [] for p in PROTOCOLS}

          # Scarcest protocol picks first so it is not starved.
          for p in sorted(PROTOCOLS, key=lambda x: len(working[x])):
              for item in working[p]:
                  if len(selected[p]) >= TARGET_PER_PROTOCOL:
                      break

                  if item["host"] in seen_hosts:
                      continue

                  seen_hosts.add(item["host"])
                  selected[p].append(item)

          result = []

          for p in PROTOCOLS:
              counters = {}

              for item in selected[p]:
                  country = item["countryCode"].lower()
                  counters[country] = counters.get(country, 0) + 1

                  country_name = COUNTRY_NAMES.get(country, country.upper())

                  result.append({
                      "name": f"{country_name} {counters[country]}",
                      "config": item["config"],
                      "countryCode": country,
                  })

          print("Final distribution:")
          print(json.dumps({p: len(selected[p]) for p in PROTOCOLS}, indent=2))
          print(f"Total working servers: {len(result)}")

          for p in PROTOCOLS:
              if len(selected[p]) < TARGET_PER_PROTOCOL:
                  print(
                      f"WARNING: only {len(selected[p])}/{TARGET_PER_PROTOCOL} "
                      f"working {p} servers found."
                  )

          # Never overwrite a good services.json with an empty one.
          if not result:
              raise SystemExit("No working servers found. services.json left unchanged.")

          with open(OUTPUT, "w", encoding="utf-8") as f:
              json.dump(result, f, ensure_ascii=False, indent=2)
              f.write("\n")

          print(f"Created {OUTPUT} with {len(result)} verified working servers.")
          PY

      - name: Show generated JSON
        run: |
          echo "================ services.json ================"
          cat services.json
          echo "================================================"

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add services.json

          if git diff --cached --quiet; then
            echo "No changes detected."
            exit 0
          fi

          git commit -m "Update mixed VPN servers"

      - name: Rebase and push
        shell: bash
        run: |
          set -e

          for i in {1..5}; do

            echo "Push attempt $i..."

            git fetch origin main

            if git rebase origin/main; then

              if git push origin HEAD:main; then
                echo "Push successful."
                exit 0
              fi

            else
              git rebase --abort || true
            fi

            echo "Push failed. Retrying..."
            sleep 5

          done

          echo "Failed to push after 5 attempts."

          exit 1
