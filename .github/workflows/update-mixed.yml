name: Update Mixed Servers

on:
  schedule:
    - cron: "45 * * * *"
  workflow_dispatch:

concurrency:
  group: update-mixed
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:

      # =========================================================
      # 1. Checkout
      # =========================================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # =========================================================
      # 2. Install dependencies + sing-box
      # =========================================================
      - name: Install dependencies
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "Installing dependencies..."
          echo "======================================"

          sudo apt-get update -qq
          sudo apt-get install -y -qq curl jq python3

          VERSION="1.14.2"

          echo "Downloading sing-box ${VERSION}..."

          curl -L --fail \
            --silent \
            --show-error \
            --max-time 60 \
            "https://github.com/SagerNet/sing-box/releases/download/v${VERSION}/sing-box-${VERSION}-linux-amd64.tar.gz" \
            -o /tmp/sing-box.tar.gz

          mkdir -p /tmp/singbox

          tar -xzf \
            /tmp/sing-box.tar.gz \
            -C /tmp/singbox

          SINGBOX_PATH=$(find /tmp/singbox \
            -type f \
            -name sing-box \
            -print \
            -quit)

          if [ -z "$SINGBOX_PATH" ]; then
            echo "ERROR: sing-box binary not found"
            exit 1
          fi

          sudo install -m 755 \
            "$SINGBOX_PATH" \
            /usr/local/bin/sing-box

          echo "sing-box installed:"
          sing-box version

      # =========================================================
      # 3. Download country subscriptions
      # =========================================================
      - name: Download country subscriptions
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "Downloading country subscriptions..."
          echo "======================================"

          mkdir -p /tmp/countries

          curl -L --fail \
            --silent \
            --show-error \
            --max-time 30 \
            "https://api.github.com/repos/Au1rxx/free-vpn-subscriptions/contents/output/by-country" \
            -o /tmp/country-list.json

          jq -r '
            .[]
            | select(.download_url != null)
            | .download_url
          ' /tmp/country-list.json \
            | grep -E 'v2ray-base64-[A-Za-z]{2}\.txt$' \
            | sort -u \
            > /tmp/country-urls.txt

          COUNT=$(wc -l < /tmp/country-urls.txt)

          echo "Country files found: $COUNT"

          if [ "$COUNT" -eq 0 ]; then
            echo "ERROR: No country files found."
            exit 1
          fi

          SUCCESS=0
          FAILED=0

          while read -r URL; do

            BASENAME=$(basename "$URL")

            echo "Downloading: $BASENAME"

            if curl -L \
              --fail \
              --silent \
              --show-error \
              --max-time 30 \
              "$URL" \
              -o "/tmp/countries/$BASENAME"; then

              if [ -s "/tmp/countries/$BASENAME" ]; then
                SUCCESS=$((SUCCESS + 1))
              else
                echo "WARNING: Empty file: $BASENAME"
                rm -f "/tmp/countries/$BASENAME"
                FAILED=$((FAILED + 1))
              fi

            else

              echo "WARNING: Download failed: $BASENAME"
              FAILED=$((FAILED + 1))

            fi

          done < /tmp/country-urls.txt

          echo ""
          echo "Download summary:"
          echo "Successful: $SUCCESS"
          echo "Failed:     $FAILED"

          if [ "$SUCCESS" -eq 0 ]; then
            echo "ERROR: No country files downloaded."
            exit 1
          fi

          echo ""
          echo "Downloaded files:"
          ls -lh /tmp/countries

      # =========================================================
      # 4. Parse candidates
      # =========================================================
      - name: Parse candidates
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "Parsing VPN candidates..."
          echo "======================================"

          python3 <<'PY'
          import os
          import re
          import json
          import base64
          import urllib.parse

          ROOT = "/tmp/countries"
          OUTPUT = "/tmp/candidates.json"

          PROTOCOLS = {
              "ss": "shadowsocks",
              "hysteria2": "hysteria2",
              "hy2": "hysteria2",
              "trojan": "trojan",
              "vless": "vless",
          }

          COUNTRY_NAMES = {
              "ad": "Andorra",
              "ae": "United Arab Emirates",
              "af": "Afghanistan",
              "al": "Albania",
              "am": "Armenia",
              "ar": "Argentina",
              "at": "Austria",
              "au": "Australia",
              "az": "Azerbaijan",
              "ba": "Bosnia and Herzegovina",
              "bd": "Bangladesh",
              "be": "Belgium",
              "bg": "Bulgaria",
              "bh": "Bahrain",
              "br": "Brazil",
              "by": "Belarus",
              "ca": "Canada",
              "ch": "Switzerland",
              "cl": "Chile",
              "cn": "China",
              "co": "Colombia",
              "cr": "Costa Rica",
              "cy": "Cyprus",
              "cz": "Czech Republic",
              "de": "Germany",
              "dk": "Denmark",
              "do": "Dominican Republic",
              "dz": "Algeria",
              "ec": "Ecuador",
              "ee": "Estonia",
              "eg": "Egypt",
              "es": "Spain",
              "fi": "Finland",
              "fr": "France",
              "gb": "United Kingdom",
              "ge": "Georgia",
              "gr": "Greece",
              "hk": "Hong Kong",
              "hr": "Croatia",
              "hu": "Hungary",
              "id": "Indonesia",
              "ie": "Ireland",
              "il": "Israel",
              "in": "India",
              "iq": "Iraq",
              "is": "Iceland",
              "it": "Italy",
              "jp": "Japan",
              "jo": "Jordan",
              "kr": "South Korea",
              "kw": "Kuwait",
              "kz": "Kazakhstan",
              "la": "Laos",
              "lb": "Lebanon",
              "li": "Liechtenstein",
              "lk": "Sri Lanka",
              "lt": "Lithuania",
              "lu": "Luxembourg",
              "lv": "Latvia",
              "ma": "Morocco",
              "md": "Moldova",
              "me": "Montenegro",
              "mk": "North Macedonia",
              "mn": "Mongolia",
              "mo": "Macau",
              "mt": "Malta",
              "mu": "Mauritius",
              "mx": "Mexico",
              "my": "Malaysia",
              "ng": "Nigeria",
              "nl": "Netherlands",
              "no": "Norway",
              "np": "Nepal",
              "nz": "New Zealand",
              "om": "Oman",
              "pa": "Panama",
              "pe": "Peru",
              "ph": "Philippines",
              "pk": "Pakistan",
              "pl": "Poland",
              "pt": "Portugal",
              "qa": "Qatar",
              "ro": "Romania",
              "rs": "Serbia",
              "ru": "Russia",
              "sa": "Saudi Arabia",
              "se": "Sweden",
              "sg": "Singapore",
              "si": "Slovenia",
              "sk": "Slovakia",
              "th": "Thailand",
              "tr": "Turkey",
              "tw": "Taiwan",
              "ua": "Ukraine",
              "uk": "United Kingdom",
              "us": "United States",
              "uy": "Uruguay",
              "uz": "Uzbekistan",
              "ve": "Venezuela",
              "vn": "Vietnam",
              "za": "South Africa",
          }

          URI_RE = re.compile(
              r'(?:ss|hysteria2|hy2|trojan|vless)://[^\s\r\n<>"\']+',
              re.I
          )

          def normalize_host(host):
              if not host:
                  return None

              host = host.strip().lower().rstrip(".")

              if host.startswith("[") and host.endswith("]"):
                  host = host[1:-1]

              return host

          def decode_base64(text):
              text = re.sub(r"\s+", "", text)

              if not text:
                  return ""

              try:
                  padded = text + "=" * (-len(text) % 4)

                  return base64.urlsafe_b64decode(
                      padded
                  ).decode(
                      "utf-8",
                      errors="ignore"
                  )

              except Exception:
                  return ""

          def decode_content(raw):
              raw = raw.strip()

              if not raw:
                  return ""

              if URI_RE.search(raw):
                  return raw

              decoded = decode_base64(raw)

              if URI_RE.search(decoded):
                  return decoded

              output = []

              for line in raw.splitlines():

                  line = line.strip()

                  if not line:
                      continue

                  if URI_RE.match(line):
                      output.append(line)
                      continue

                  value = decode_base64(line)

                  if URI_RE.search(value):
                      output.append(value)

              return "\n".join(output)

          def country_from_filename(filename):
              match = re.search(
                  r'v2ray-base64-([a-zA-Z]{2})\.txt$',
                  filename
              )

              if not match:
                  return "unknown", "Unknown"

              code = match.group(1).lower()

              return (
                  code,
                  COUNTRY_NAMES.get(
                      code,
                      code.upper()
                  )
              )

          def parse_ss_host(uri):
              parsed = urllib.parse.urlparse(uri)

              # SIP002:
              # ss://BASE64(method:password)@host:port
              # ss://method:password@host:port

              if parsed.hostname:
                  return normalize_host(
                      parsed.hostname
                  )

              raw = uri[5:].split("#", 1)[0]

              if "@" in raw:
                  address = raw.rsplit("@", 1)[1]

              else:
                  decoded = decode_base64(raw)

                  if "@" not in decoded:
                      return None

                  address = decoded.rsplit(
                      "@",
                      1
                  )[1]

              try:

                  if address.startswith("["):
                      end = address.find("]")

                      if end == -1:
                          return None

                      host = address[1:end]

                  else:
                      host = address.rsplit(
                          ":",
                          1
                      )[0]

                  return normalize_host(host)

              except Exception:
                  return None

          candidates = []

          for filename in sorted(
              os.listdir(ROOT)
          ):

              path = os.path.join(
                  ROOT,
                  filename
              )

              if not os.path.isfile(path):
                  continue

              country_code, country_name = (
                  country_from_filename(filename)
              )

              try:

                  with open(
                      path,
                      "r",
                      encoding="utf-8",
                      errors="ignore"
                  ) as f:

                      raw = f.read()

              except Exception:

                  continue

              decoded = decode_content(raw)

              for uri in URI_RE.findall(decoded):

                  uri = uri.strip()

                  try:

                      parsed = urllib.parse.urlparse(
                          uri
                      )

                      scheme = parsed.scheme.lower()

                  except Exception:

                      continue

                  protocol = PROTOCOLS.get(scheme)

                  if not protocol:
                      continue

                  if scheme == "ss":

                      host = parse_ss_host(uri)

                  else:

                      try:
                          host = normalize_host(
                              parsed.hostname
                          )
                      except Exception:
                          host = None

                  if not host:
                      continue

                  # Validate port where applicable.
                  try:

                      if scheme != "ss":
                          _ = parsed.port

                  except Exception:

                      continue

                  candidates.append({
                      "country": country_name,
                      "countryCode": country_code,
                      "protocol": protocol,
                      "config": uri,
                      "host": host
                  })

          # =====================================================
          # Exact config deduplication only.
          #
          # IMPORTANT:
          # Do NOT remove duplicate hosts here.
          # Different protocols/ports may share the same host
          # and only one of them may actually work.
          # =====================================================

          unique = {}

          for item in candidates:

              key = (
                  item["protocol"],
                  item["config"]
              )

              if key not in unique:
                  unique[key] = item

          candidates = list(
              unique.values()
          )

          with open(
              OUTPUT,
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  candidates,
                  f,
                  ensure_ascii=False
              )

          print(
              f"Candidates found: {len(candidates)}"
          )

          print("")

          for protocol in (
              "shadowsocks",
              "hysteria2",
              "trojan",
              "vless"
          ):

              count = sum(
                  1
                  for x in candidates
                  if x["protocol"] == protocol
              )

              print(
                  f"{protocol}: {count}"
              )

          PY

      # =========================================================
      # 5. Test VPN servers
      # =========================================================
      - name: Test VPN servers
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "Testing VPN servers"
          echo "======================================"

          python3 <<'PY'
          import json
          import subprocess
          import tempfile
          import os
          import time
          import socket
          import urllib.parse
          import base64

          from concurrent.futures import (
              ThreadPoolExecutor,
              as_completed
          )

          INPUT = "/tmp/candidates.json"
          OUTPUT = "/tmp/working.json"

          with open(
              INPUT,
              "r",
              encoding="utf-8"
          ) as f:
              candidates = json.load(f)

          print(
              f"Total candidates: {len(candidates)}",
              flush=True
          )

          # =====================================================
          # Helpers
          # =====================================================

          def query_value(qs, *names):

              for name in names:

                  value = qs.get(name)

                  if value:
                      return value[0]

              return None

          def query_values(qs, name):

              value = qs.get(name)

              if not value:
                  return []

              return [
                  x.strip()
                  for x in value[0].split(",")
                  if x.strip()
              ]

          def bool_value(value):

              if value is None:
                  return False

              return str(value).lower() in (
                  "1",
                  "true",
                  "yes"
              )

          def decode_b64(text):

              try:

                  text = text.strip()

                  padded = (
                      text +
                      "=" * (-len(text) % 4)
                  )

                  return base64.urlsafe_b64decode(
                      padded
                  ).decode(
                      "utf-8",
                      errors="ignore"
                  )

              except Exception:

                  return ""

          # =====================================================
          # TLS
          # =====================================================

          def build_tls(qs):

              tls = {
                  "enabled": True
              }

              sni = query_value(
                  qs,
                  "sni",
                  "serverName",
                  "servername"
              )

              if sni:
                  tls["server_name"] = (
                      urllib.parse.unquote(sni)
                  )

              insecure = query_value(
                  qs,
                  "allowInsecure",
                  "allowinsecure",
                  "insecure"
              )

              if insecure is not None:
                  tls["insecure"] = bool_value(
                      insecure
                  )

              alpn = query_values(
                  qs,
                  "alpn"
              )

              if alpn:
                  tls["alpn"] = alpn

              fingerprint = query_value(
                  qs,
                  "fp",
                  "fingerprint"
              )

              if fingerprint:
                  tls["utls"] = {
                      "enabled": True,
                      "fingerprint": fingerprint
                  }

              security = query_value(
                  qs,
                  "security"
              )

              if security == "reality":

                  public_key = query_value(
                      qs,
                      "pbk",
                      "publicKey",
                      "public-key"
                  )

                  short_id = query_value(
                      qs,
                      "sid",
                      "shortId",
                      "short-id"
                  )

                  if public_key:

                      reality = {
                          "enabled": True,
                          "public_key": public_key
                      }

                      if short_id:
                          reality["short_id"] = (
                              short_id
                          )

                      tls["reality"] = reality

              return tls

          # =====================================================
          # V2Ray transports
          # =====================================================

          def build_transport(qs):

              network = query_value(
                  qs,
                  "type",
                  "network"
              )

              if not network:
                  return None

              network = (
                  urllib.parse.unquote(
                      network
                  )
                  .lower()
              )

              # WebSocket
              if network == "ws":

                  transport = {
                      "type": "ws"
                  }

                  path = query_value(
                      qs,
                      "path"
                  )

                  host = query_value(
                      qs,
                      "host",
                      "authority"
                  )

                  if path:
                      transport["path"] = (
                          urllib.parse.unquote(
                              path
                          )
                      )

                  if host:
                      transport["headers"] = {
                          "Host": (
                              urllib.parse.unquote(
                                  host
                              )
                          )
                      }

                  ed = query_value(
                      qs,
                      "ed"
                  )

                  if ed:

                      try:
                          transport[
                              "max_early_data"
                          ] = int(ed)
                      except Exception:
                          pass

                  if query_value(
                      qs,
                      "eh",
                      "early_data_header_name"
                  ):

                      transport[
                          "early_data_header_name"
                      ] = query_value(
                          qs,
                          "eh",
                          "early_data_header_name"
                      )

                  return transport

              # gRPC
              if network == "grpc":

                  transport = {
                      "type": "grpc"
                  }

                  service = query_value(
                      qs,
                      "serviceName",
                      "servicename",
                      "service"
                  )

                  if service:
                      transport[
                          "service_name"
                      ] = (
                          urllib.parse.unquote(
                              service
                          )
                      )

                  return transport

              # HTTP Upgrade
              if network in (
                  "httpupgrade",
                  "http-upgrade"
              ):

                  transport = {
                      "type": "httpupgrade"
                  }

                  path = query_value(
                      qs,
                      "path"
                  )

                  host = query_value(
                      qs,
                      "host"
                  )

                  if path:
                      transport["path"] = (
                          urllib.parse.unquote(
                              path
                          )
                      )

                  if host:
                      transport["host"] = (
                          urllib.parse.unquote(
                              host
                          )
                      )

                  return transport

              # V2Ray HTTP
              if network in (
                  "http",
                  "h2"
              ):

                  transport = {
                      "type": "http"
                  }

                  path = query_value(
                      qs,
                      "path"
                  )

                  host = query_value(
                      qs,
                      "host"
                  )

                  if path:
                      transport["path"] = (
                          urllib.parse.unquote(
                              path
                          )
                      )

                  if host:
                      transport["host"] = [
                          urllib.parse.unquote(
                              host
                          )
                      ]

                  return transport

              # QUIC transport
              if network == "quic":

                  return {
                      "type": "quic"
                  }

              return None

          # =====================================================
          # Shadowsocks
          # =====================================================

          def parse_ss(uri):

              parsed = urllib.parse.urlparse(
                  uri
              )

              host = parsed.hostname
              port = parsed.port

              # SIP002 raw:
              # ss://method:password@host:port
              if host:

                  username = (
                      parsed.username or ""
                  )

                  password = (
                      parsed.password or ""
                  )

                  username = urllib.parse.unquote(
                      username
                  )

                  password = urllib.parse.unquote(
                      password
                  )

                  if ":" in username:

                      method, password2 = (
                          username.split(
                              ":",
                              1
                          )
                      )

                      if not password:
                          password = password2

                  else:

                      method = username

                  if method and password:

                      outbound = {
                          "type": "shadowsocks",
                          "tag": "proxy",
                          "server": host,
                          "server_port": port or 443,
                          "method": method,
                          "password": password
                      }

                  else:

                      outbound = None

                  # Plugin parameters
                  qs = urllib.parse.parse_qs(
                      parsed.query,
                      keep_blank_values=True
                  )

                  plugin = query_value(
                      qs,
                      "plugin"
                  )

                  if (
                      outbound
                      and plugin
                  ):

                      plugin = (
                          urllib.parse.unquote(
                              plugin
                          )
                      )

                      parts = plugin.split(";")

                      plugin_name = parts[0]

                      if plugin_name in (
                          "obfs-local",
                          "v2ray-plugin"
                      ):

                          outbound[
                              "plugin"
                          ] = plugin_name

                          if len(parts) > 1:
                              outbound[
                                  "plugin_opts"
                              ] = ";".join(
                                  parts[1:]
                              )

                  if outbound:
                      return outbound

              # Legacy/base64:
              # ss://BASE64(method:password@host:port)
              raw = uri[5:].split(
                  "#",
                  1
              )[0]

              if "@" not in raw:

                  raw = decode_b64(raw)

              else:

                  # Sometimes userinfo itself is base64.
                  left, right = raw.rsplit(
                      "@",
                      1
                  )

                  if ":" not in left:

                      decoded_left = decode_b64(
                          left
                      )

                      if decoded_left:
                          raw = (
                              decoded_left +
                              "@" +
                              right
                          )

              if "@" not in raw:
                  return None

              userinfo, address = raw.rsplit(
                  "@",
                  1
              )

              if ":" not in userinfo:
                  return None

              method, password = (
                  userinfo.split(
                      ":",
                      1
                  )
              )

              method = urllib.parse.unquote(
                  method
              )

              password = urllib.parse.unquote(
                  password
              )

              try:

                  if address.startswith("["):

                      end = address.find("]")

                      if end == -1:
                          return None

                      host = address[
                          1:end
                      ]

                      port = int(
                          address[
                              end + 2:
                          ]
                      )

                  else:

                      host, port_text = (
                          address.rsplit(
                              ":",
                              1
                          )
                      )

                      port = int(
                          port_text
                      )

              except Exception:

                  return None

              return {
                  "type": "shadowsocks",
                  "tag": "proxy",
                  "server": host,
                  "server_port": port,
                  "method": method,
                  "password": password
              }

          # =====================================================
          # URI parser
          # =====================================================

          def parse_uri(uri):

              parsed = urllib.parse.urlparse(
                  uri
              )

              scheme = (
                  parsed.scheme.lower()
              )

              qs = urllib.parse.parse_qs(
                  parsed.query,
                  keep_blank_values=True
              )

              host = parsed.hostname

              if not host and scheme == "ss":

                  ss = parse_ss(uri)

                  if ss:
                      return ss

                  return None

              if not host:
                  return None

              try:
                  port = parsed.port or 443
              except Exception:
                  return None

              # =================================================
              # Shadowsocks
              # =================================================

              if scheme == "ss":

                  return parse_ss(uri)

              # =================================================
              # Trojan
              # =================================================

              if scheme == "trojan":

                  password = urllib.parse.unquote(
                      parsed.username or ""
                  )

                  if not password:
                      return None

                  outbound = {
                      "type": "trojan",
                      "tag": "proxy",
                      "server": host,
                      "server_port": port,
                      "password": password
                  }

                  security = query_value(
                      qs,
                      "security"
                  )

                  if (
                      security
                      and security != "none"
                  ):

                      outbound["tls"] = (
                          build_tls(qs)
                      )

                  else:

                      # Trojan normally uses TLS.
                      outbound["tls"] = (
                          build_tls(qs)
                      )

                  transport = build_transport(
                      qs
                  )

                  if transport:
                      outbound[
                          "transport"
                      ] = transport

                  return outbound

              # =================================================
              # Hysteria2
              # =================================================

              if scheme in (
                  "hysteria2",
                  "hy2"
              ):

                  password = urllib.parse.unquote(
                      parsed.username or ""
                  )

                  if not password:
                      return None

                  outbound = {
                      "type": "hysteria2",
                      "tag": "proxy",
                      "server": host,
                      "server_port": port,
                      "password": password,
                      "tls": build_tls(qs)
                  }

                  obfs_type = query_value(
                      qs,
                      "obfs"
                  )

                  obfs_password = query_value(
                      qs,
                      "obfs-password",
                      "obfs_password"
                  )

                  if obfs_type:

                      obfs_type = (
                          urllib.parse.unquote(
                              obfs_type
                          )
                      )

                      obfs = {
                          "type": obfs_type
                      }

                      if obfs_password:
                          obfs[
                              "password"
                          ] = (
                              urllib.parse.unquote(
                                  obfs_password
                              )
                          )

                      outbound[
                          "obfs"
                      ] = obfs

                  hop_interval = query_value(
                      qs,
                      "hop-interval"
                  )

                  if hop_interval:
                      outbound[
                          "hop_interval"
                      ] = hop_interval

                  hop_interval_max = query_value(
                      qs,
                      "hop-interval-max"
                  )

                  if hop_interval_max:
                      outbound[
                          "hop_interval_max"
                      ] = hop_interval_max

                  bbr_profile = query_value(
                      qs,
                      "bbr-profile"
                  )

                  if bbr_profile:
                      outbound[
                          "bbr_profile"
                      ] = bbr_profile

                  return outbound

              # =================================================
              # VLESS
              # =================================================

              if scheme == "vless":

                  uuid = urllib.parse.unquote(
                      parsed.username or ""
                  )

                  if not uuid:
                      return None

                  outbound = {
                      "type": "vless",
                      "tag": "proxy",
                      "server": host,
                      "server_port": port,
                      "uuid": uuid
                  }

                  flow = query_value(
                      qs,
                      "flow"
                  )

                  if flow:
                      outbound[
                          "flow"
                      ] = flow

                  packet_encoding = query_value(
                      qs,
                      "packetEncoding",
                      "packet_encoding"
                  )

                  if packet_encoding:
                      outbound[
                          "packet_encoding"
                      ] = packet_encoding

                  # IMPORTANT:
                  # VLESS network only supports tcp/udp.
                  network = query_value(
                      qs,
                      "network"
                  )

                  if network in (
                      "tcp",
                      "udp"
                  ):

                      outbound[
                          "network"
                      ] = network

                  security = query_value(
                      qs,
                      "security"
                  )

                  if security in (
                      "tls",
                      "reality"
                  ):

                      outbound[
                          "tls"
                      ] = build_tls(qs)

                  transport = build_transport(
                      qs
                  )

                  if transport:
                      outbound[
                          "transport"
                      ] = transport

                  return outbound

              return None

          # =====================================================
          # Free TCP port
          # =====================================================

          def free_port():

              sock = socket.socket(
                  socket.AF_INET,
                  socket.SOCK_STREAM
              )

              sock.bind(
                  ("127.0.0.1", 0)
              )

              port = sock.getsockname()[1]

              sock.close()

              return port

          # =====================================================
          # Test one server
          # =====================================================

          def test(item):

              process = None
              conf_path = None

              try:

                  outbound = parse_uri(
                      item["config"]
                  )

                  if not outbound:
                      return None, "parse"

                  port = free_port()

                  config = {
                      "log": {
                          "disabled": True
                      },

                      "dns": {
                          "servers": [
                              {
                                  "type": "local"
                              }
                          ]
                      },

                      "inbounds": [
                          {
                              "type": "mixed",
                              "tag": "mixed-in",
                              "listen": "127.0.0.1",
                              "listen_port": port
                          }
                      ],

                      "outbounds": [
                          outbound
                      ]
                  }

                  with tempfile.NamedTemporaryFile(
                      mode="w",
                      suffix=".json",
                      delete=False,
                      encoding="utf-8"
                  ) as f:

                      json.dump(
                          config,
                          f,
                          ensure_ascii=False
                      )

                      conf_path = f.name

                  # -------------------------------------------------
                  # Validate configuration.
                  # sing-box explicitly supports `check`.
                  # -------------------------------------------------

                  check = subprocess.run(
                      [
                          "sing-box",
                          "check",
                          "-c",
                          conf_path
                      ],
                      stdout=subprocess.DEVNULL,
                      stderr=subprocess.DEVNULL,
                      timeout=5
                  )

                  if check.returncode != 0:
                      return None, "config"

                  # -------------------------------------------------
                  # Start sing-box.
                  # -------------------------------------------------

                  process = subprocess.Popen(
                      [
                          "sing-box",
                          "run",
                          "-c",
                          conf_path
                      ],
                      stdout=subprocess.DEVNULL,
                      stderr=subprocess.DEVNULL
                  )

                  ready = False

                  for _ in range(30):

                      if process.poll() is not None:
                          return None, "startup"

                      try:

                          sock = socket.create_connection(
                              (
                                  "127.0.0.1",
                                  port
                              ),
                              timeout=0.2
                          )

                          sock.close()

                          ready = True
                          break

                      except Exception:

                          time.sleep(0.1)

                  if not ready:
                      return None, "startup"

                  # -------------------------------------------------
                  # Real HTTPS request through SOCKS5.
                  # -------------------------------------------------

                  start = time.monotonic()

                  result = subprocess.run(
                      [
                          "curl",
                          "--silent",
                          "--show-error",
                          "--connect-timeout",
                          "2",
                          "--max-time",
                          "5",
                          "--socks5-hostname",
                          f"127.0.0.1:{port}",
                          "https://cp.cloudflare.com/generate_204",
                          "-o",
                          "/dev/null",
                          "-w",
                          "%{http_code}"
                      ],
                      stdout=subprocess.PIPE,
                      stderr=subprocess.DEVNULL,
                      text=True,
                      timeout=7
                  )

                  latency = int(
                      (
                          time.monotonic()
                          - start
                      ) * 1000
                  )

                  if (
                      result.returncode == 0
                      and result.stdout.strip() == "204"
                  ):

                      result_item = dict(item)

                      result_item[
                          "latency_ms"
                      ] = latency

                      return result_item, "ok"

                  return None, "request"

              except subprocess.TimeoutExpired:

                  return None, "timeout"

              except Exception:

                  return None, "exception"

              finally:

                  if process is not None:

                      try:
                          process.kill()
                      except Exception:
                          pass

                      try:
                          process.wait(
                              timeout=1
                          )
                      except Exception:
                          pass

                  if conf_path:

                      try:
                          os.unlink(
                              conf_path
                          )
                      except Exception:
                          pass

          # =====================================================
          # Parallel testing
          # =====================================================

          MAX_WORKERS = 12

          print(
              f"Starting {MAX_WORKERS} parallel tests...",
              flush=True
          )

          results = []

          failures = {
              "parse": 0,
              "config": 0,
              "startup": 0,
              "request": 0,
              "timeout": 0,
              "exception": 0
          }

          completed = 0
          total = len(candidates)

          with ThreadPoolExecutor(
              max_workers=MAX_WORKERS
          ) as executor:

              futures = [
                  executor.submit(
                      test,
                      item
                  )
                  for item in candidates
              ]

              for future in as_completed(
                  futures
              ):

                  completed += 1

                  try:
                      result, reason = (
                          future.result()
                      )
                  except Exception:
                      result = None
                      reason = "exception"

                  if result:

                      results.append(
                          result
                      )

                  else:

                      failures[
                          reason
                      ] = (
                          failures.get(
                              reason,
                              0
                          ) + 1
                      )

                  if (
                      completed % 10 == 0
                      or completed == total
                  ):

                      print(
                          f"Progress: "
                          f"{completed}/{total} | "
                          f"Working: {len(results)}",
                          flush=True
                      )

          # =====================================================
          # Remove duplicate working configs.
          # Keep fastest candidate for each
          # (host, protocol).
          # =====================================================

          best = {}

          for item in results:

              key = (
                  item["host"],
                  item["protocol"]
              )

              current = best.get(key)

              if (
                  current is None
                  or item["latency_ms"]
                  < current["latency_ms"]
              ):

                  best[key] = item

          results = list(
              best.values()
          )

          results.sort(
              key=lambda x: x.get(
                  "latency_ms",
                  999999
              )
          )

          with open(
              OUTPUT,
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  results,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print("")
          print("Testing summary:")
          print(
              f"Working unique host/protocol pairs: "
              f"{len(results)}"
          )

          print("")

          for protocol in (
              "shadowsocks",
              "hysteria2",
              "trojan",
              "vless"
          ):

              count = sum(
                  1
                  for x in results
                  if x["protocol"] == protocol
              )

              print(
                  f"{protocol}: {count}"
              )

          print("")
          print("Failure summary:")

          for reason, count in failures.items():

              print(
                  f"{reason}: {count}"
              )

          PY

      # =========================================================
      # 6. Select exactly 20 per protocol
      #    using max-flow with global host uniqueness
      # =========================================================
      - name: Build final services.json
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "Building final services.json..."
          echo "======================================"

          python3 <<'PY'
          import json
          import sys
          from collections import defaultdict

          INPUT = "/tmp/working.json"
          OUTPUT = "services.json"

          REQUIRED = {
              "shadowsocks": 20,
              "hysteria2": 20,
              "trojan": 20,
              "vless": 20
          }

          PROTOCOL_ORDER = [
              "shadowsocks",
              "hysteria2",
              "trojan",
              "vless"
          ]

          with open(
              INPUT,
              "r",
              encoding="utf-8"
          ) as f:

              servers = json.load(f)

          # =====================================================
          # Group by host + protocol.
          # Keep fastest candidate.
          # =====================================================

          best = {}

          for item in servers:

              key = (
                  item["host"],
                  item["protocol"]
              )

              old = best.get(key)

              if (
                  old is None
                  or item.get(
                      "latency_ms",
                      999999
                  ) < old.get(
                      "latency_ms",
                      999999
                  )
              ):

                  best[key] = item

          # host -> protocol -> candidate
          host_map = defaultdict(dict)

          for (
              host,
              protocol
          ), item in best.items():

              host_map[host][protocol] = item

          print("")
          print("Available working servers:")

          for protocol in PROTOCOL_ORDER:

              count = sum(
                  1
                  for host in host_map
                  if protocol in host_map[host]
              )

              print(
                  f"{protocol}: {count}"
              )

          # =====================================================
          # Max-flow implementation.
          #
          # Source -> host       capacity 1
          # Host -> protocol     capacity 1
          # Protocol -> sink     capacity 20
          #
          # This guarantees:
          # - one server per host
          # - exactly 20 per protocol
          # - no greedy dead-end
          # =====================================================

          class Edge:

              def __init__(
                  self,
                  to,
                  rev,
                  cap
              ):

                  self.to = to
                  self.rev = rev
                  self.cap = cap

          class Dinic:

              def __init__(self, n):

                  self.n = n
                  self.graph = [
                      []
                      for _ in range(n)
                  ]

              def add_edge(
                  self,
                  u,
                  v,
                  cap
              ):

                  forward = Edge(
                      v,
                      len(
                          self.graph[v]
                      ),
                      cap
                  )

                  backward = Edge(
                      u,
                      len(
                          self.graph[u]
                      ),
                      0
                  )

                  self.graph[u].append(
                      forward
                  )

                  self.graph[v].append(
                      backward
                  )

              def bfs(
                  self,
                  source,
                  sink
              ):

                  level = [
                      -1
                      for _ in range(self.n)
                  ]

                  queue = [source]

                  level[source] = 0

                  head = 0

                  while head < len(queue):

                      u = queue[head]
                      head += 1

                      for edge in self.graph[u]:

                          if (
                              edge.cap > 0
                              and level[
                                  edge.to
                              ] < 0
                          ):

                              level[
                                  edge.to
                              ] = (
                                  level[u] + 1
                              )

                              queue.append(
                                  edge.to
                              )

                  return level

              def dfs(
                  self,
                  u,
                  sink,
                  pushed,
                  level,
                  it
              ):

                  if u == sink:
                      return pushed

                  while (
                      it[u]
                      < len(
                          self.graph[u]
                      )
                  ):

                      edge = self.graph[u][
                          it[u]
                      ]

                      if (
                          edge.cap > 0
                          and level[
                              edge.to
                          ] == level[u] + 1
                      ):

                          flow = self.dfs(
                              edge.to,
                              sink,
                              min(
                                  pushed,
                                  edge.cap
                              ),
                              level,
                              it
                          )

                          if flow:

                              edge.cap -= flow

                              self.graph[
                                  edge.to
                              ][
                                  edge.rev
                              ].cap += flow

                              return flow

                      it[u] += 1

                  return 0

              def max_flow(
                  self,
                  source,
                  sink
              ):

                  flow = 0

                  while True:

                      level = self.bfs(
                          source,
                          sink
                      )

                      if level[sink] < 0:
                          break

                      it = [
                          0
                          for _ in range(self.n)
                      ]

                      while True:

                          pushed = self.dfs(
                              source,
                              sink,
                              10**9,
                              level,
                              it
                          )

                          if not pushed:
                              break

                          flow += pushed

                  return flow

          # =====================================================
          # Create graph
          # =====================================================

          hosts = sorted(
              host_map.keys()
          )

          host_index = {
              host: i
              for i, host in enumerate(
                  hosts
              )
          }

          host_count = len(hosts)

          protocol_base = host_count

          protocol_index = {
              protocol: (
                  protocol_base + i
              )
              for i, protocol in enumerate(
                  PROTOCOL_ORDER
              )
          }

          source = (
              protocol_base +
              len(PROTOCOL_ORDER)
          )

          sink = source + 1

          graph = Dinic(
              sink + 1
          )

          # Source -> host
          for host in hosts:

              graph.add_edge(
                  source,
                  host_index[host],
                  1
              )

          # Host -> protocol
          for host in hosts:

              h = host_index[host]

              for protocol in PROTOCOL_ORDER:

                  if (
                      protocol
                      in host_map[host]
                  ):

                      graph.add_edge(
                          h,
                          protocol_index[
                              protocol
                          ],
                          1
                      )

          # Protocol -> sink
          for protocol in PROTOCOL_ORDER:

              graph.add_edge(
                  protocol_index[
                      protocol
                  ],
                  sink,
                  REQUIRED[protocol]
              )

          flow = graph.max_flow(
              source,
              sink
          )

          print("")
          print(
              f"Maximum possible unique selection: "
              f"{flow}/80"
          )

          if flow != 80:

              print("")
              print(
                  "ERROR: There are not enough "
                  "working unique hosts to build "
                  "80 servers."
              )

              print(
                  "The workflow will NOT publish "
                  "an incomplete list."
              )

              sys.exit(1)

          # =====================================================
          # Recover selected host/protocol pairs.
          # =====================================================

          selected = {
              protocol: []
              for protocol in PROTOCOL_ORDER
          }

          for host in hosts:

              h = host_index[host]

              for edge in graph.graph[h]:

                  # Host -> protocol edge originally had cap=1.
                  # If used by max-flow, its residual cap is 0.
                  if edge.cap != 0:
                      continue

                  protocol = None

                  for candidate_protocol in (
                      PROTOCOL_ORDER
                  ):

                      if (
                          edge.to
                          == protocol_index[
                              candidate_protocol
                          ]
                      ):

                          protocol = (
                              candidate_protocol
                          )

                          break

                  if protocol is None:
                      continue

                  selected[
                      protocol
                  ].append(
                      host_map[host][
                          protocol
                      ]
                  )

          # =====================================================
          # Validate exact counts.
          # =====================================================

          print("")
          print("Final selection:")

          total = 0

          for protocol in PROTOCOL_ORDER:

              count = len(
                  selected[protocol]
              )

              required = REQUIRED[
                  protocol
              ]

              print(
                  f"{protocol}: "
                  f"{count}/{required}"
              )

              if count != required:

                  print(
                      "ERROR: Invalid final "
                      "protocol count."
                  )

                  sys.exit(1)

              total += count

          if total != 80:

              print(
                  f"ERROR: Expected 80, got {total}"
              )

              sys.exit(1)

          # =====================================================
          # Final host uniqueness validation.
          # =====================================================

          used_hosts = set()

          for protocol in PROTOCOL_ORDER:

              for item in selected[protocol]:

                  host = item["host"]

                  if host in used_hosts:

                      print(
                          "ERROR: Duplicate host:",
                          host
                      )

                      sys.exit(1)

                  used_hosts.add(host)

          if len(used_hosts) != 80:

              print(
                  "ERROR: Final host count is not 80."
              )

              sys.exit(1)

          # =====================================================
          # Build internal records.
          # =====================================================

          final = []

          for protocol in PROTOCOL_ORDER:

              for item in selected[protocol]:

                  final.append({
                      "name": "",
                      "config": item["config"],
                      "countryCode": item[
                          "countryCode"
                      ],
                      "_country": item[
                          "country"
                      ],
                      "_protocol": protocol,
                      "_latency": item.get(
                          "latency_ms",
                          999999
                      ),
                      "_host": item[
                          "host"
                      ]
                  })

          # =====================================================
          # Sort country first.
          # =====================================================

          final.sort(
              key=lambda x: (
                  x["_country"].lower(),
                  x["_latency"],
                  PROTOCOL_ORDER.index(
                      x["_protocol"]
                  )
              )
          )

          # =====================================================
          # Sequential numbering INSIDE country
          # across ALL protocols.
          # =====================================================

          counters = {}

          for item in final:

              country = item[
                  "_country"
              ]

              counters[country] = (
                  counters.get(
                      country,
                      0
                  ) + 1
              )

              item["name"] = (
                  f"{country} "
                  f"{counters[country]}"
              )

          # =====================================================
          # Output only required fields.
          # =====================================================

          output = []

          for item in final:

              output.append({
                  "name": item["name"],
                  "config": item["config"],
                  "countryCode": item[
                      "countryCode"
                  ]
              })

          # =====================================================
          # Final JSON validation.
          # =====================================================

          if len(output) != 80:

              print(
                  "ERROR: Output does not contain 80 servers."
              )

              sys.exit(1)

          if len({
              item["_host"]
              for item in final
          }) != 80:

              print(
                  "ERROR: Output contains duplicate hosts."
              )

              sys.exit(1)

          # =====================================================
          # Write services.json
          # =====================================================

          with open(
              OUTPUT,
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  output,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print("")
          print(
              "Successfully created services.json"
          )

          print(
              "Total servers: 80"
          )

          print("")
          print("Servers by country:")
          print("")

          current_country = None

          for item in output:

              country = item["name"].rsplit(
                  " ",
                  1
              )[0]

              if country != current_country:

                  current_country = country

                  print(
                      f"[{country}]"
                  )

              print(
                  f"  {item['name']}"
              )

          PY

      # =========================================================
      # 7. Show final JSON
      # =========================================================
      - name: Show services.json
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "FINAL services.json"
          echo "======================================"

          cat services.json

      # =========================================================
      # 8. Commit
      # =========================================================
      - name: Commit changes
        shell: bash
        run: |
          set -e

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add services.json

          if git diff --cached --quiet; then

            echo "No changes."

            exit 0

          fi

          git commit \
            -m "Update mixed VPN servers"

      # =========================================================
      # 9. Push
      # =========================================================
      - name: Push changes
        shell: bash
        run: |
          set -e

          for i in 1 2 3; do

            echo "Push attempt $i..."

            git pull \
              --rebase \
              origin main

            if git push \
              origin HEAD:main; then

              echo "Push successful."

              exit 0

            fi

            sleep 3

          done

          echo "ERROR: Failed to push."

          exit 1
