name: Update Mixed VPN Servers

on:
  schedule:
    - cron: "45 * * * *"
  workflow_dispatch:

concurrency:
  group: update-mixed
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download country subscriptions
        shell: bash
        run: |
          set -e

          mkdir -p /tmp/vpn_sources

          echo "Fetching country files..."

          curl -fsSL \
            "https://api.github.com/repos/Au1rxx/free-vpn-subscriptions/contents/output/by-country" \
            -o /tmp/files.json

          python - <<'PY'
          import json
          import os
          import urllib.request

          API_FILE = "/tmp/files.json"
          OUT_DIR = "/tmp/vpn_sources"

          with open(API_FILE, "r", encoding="utf-8") as f:
              files = json.load(f)

          downloaded = 0

          for item in files:
              filename = item.get("name", "")

              if not filename.startswith("v2ray-base64-"):
                  continue

              if not filename.endswith(".txt"):
                  continue

              country = filename[
                  len("v2ray-base64-"):
                  -len(".txt")
              ].lower()

              if not country:
                  continue

              url = item.get("download_url")

              if not url:
                  continue

              output = os.path.join(
                  OUT_DIR,
                  f"{country}.txt"
              )

              print(f"Downloading: {filename}")

              urllib.request.urlretrieve(
                  url,
                  output
              )

              downloaded += 1

          print(f"Downloaded {downloaded} country files.")

          if downloaded == 0:
              raise SystemExit(
                  "No country subscription files found."
              )
          PY

      - name: Generate services.json
        shell: bash
        run: |
          set -e

          python - <<'PY'
          import base64
          import json
          import os
          import re

          SOURCE_DIR = "/tmp/vpn_sources"
          OUTPUT = "services.json"

          # Exactly 20 servers from each protocol.
          TARGETS = {
              "ss": 20,
              "hysteria2": 20,
              "trojan": 20,
              "vless": 20,
          }

          # Country names.
          COUNTRY_NAMES = {
              "us": "United States",
              "gb": "United Kingdom",
              "ca": "Canada",
              "de": "Germany",
              "fr": "France",
              "nl": "Netherlands",
              "jp": "Japan",
              "sg": "Singapore",
              "hk": "Hong Kong",
              "kr": "South Korea",
              "tw": "Taiwan",
              "in": "India",
              "ae": "United Arab Emirates",
              "au": "Australia",
              "es": "Spain",
              "it": "Italy",
              "pl": "Poland",
              "se": "Sweden",
              "fi": "Finland",
              "ro": "Romania",
              "id": "Indonesia",
              "my": "Malaysia",
              "th": "Thailand",
              "vn": "Vietnam",
              "br": "Brazil",
              "mx": "Mexico",
              "ch": "Switzerland",
              "at": "Austria",
              "be": "Belgium",
              "dk": "Denmark",
              "no": "Norway",
              "cz": "Czech Republic",
              "ua": "Ukraine",
              "tr": "Turkey",
              "ru": "Russia",
              "il": "Israel",
              "za": "South Africa",
              "pt": "Portugal",
              "gr": "Greece",
              "ie": "Ireland",
              "nz": "New Zealand",
              "ph": "Philippines",
              "pk": "Pakistan",
              "bd": "Bangladesh",
              "ar": "Argentina",
              "cl": "Chile",
              "co": "Colombia",
              "pe": "Peru",
          }

          def decode_subscription(text):
              text = text.strip()

              if not text:
                  return []

              # First try plain lines.
              plain_lines = [
                  line.strip()
                  for line in text.splitlines()
                  if line.strip()
              ]

              if any(
                  line.lower().startswith(
                      (
                          "ss://",
                          "hysteria2://",
                          "hy2://",
                          "trojan://",
                          "vless://",
                      )
                  )
                  for line in plain_lines
              ):
                  return plain_lines

              # Remove whitespace for Base64.
              compact = re.sub(
                  r"\s+",
                  "",
                  text
              )

              # Normal Base64.
              try:
                  padding = "=" * (-len(compact) % 4)

                  decoded = base64.b64decode(
                      compact + padding,
                      validate=False
                  ).decode(
                      "utf-8",
                      errors="ignore"
                  )

                  lines = [
                      line.strip()
                      for line in decoded.splitlines()
                      if line.strip()
                  ]

                  if lines:
                      return lines

              except Exception:
                  pass

              # URL-safe Base64.
              try:
                  padding = "=" * (-len(compact) % 4)

                  decoded = base64.urlsafe_b64decode(
                      compact + padding
                  ).decode(
                      "utf-8",
                      errors="ignore"
                  )

                  return [
                      line.strip()
                      for line in decoded.splitlines()
                      if line.strip()
                  ]

              except Exception:
                  return []

          def get_protocol(uri):
              lower = uri.lower()

              if lower.startswith("ss://"):
                  return "ss"

              if (
                  lower.startswith("hysteria2://")
                  or lower.startswith("hy2://")
              ):
                  return "hysteria2"

              if lower.startswith("trojan://"):
                  return "trojan"

              if lower.startswith("vless://"):
                  return "vless"

              return None

          # Pools for every protocol.
          pools = {
              "ss": [],
              "hysteria2": [],
              "trojan": [],
              "vless": [],
          }

          # Deduplication.
          seen = {
              "ss": set(),
              "hysteria2": set(),
              "trojan": set(),
              "vless": set(),
          }

          files = sorted(
              filename
              for filename in os.listdir(SOURCE_DIR)
              if filename.endswith(".txt")
          )

          print(f"Found {len(files)} country files.")

          for filename in files:
              country = filename[:-4].lower()

              path = os.path.join(
                  SOURCE_DIR,
                  filename
              )

              try:
                  with open(
                      path,
                      "r",
                      encoding="utf-8",
                      errors="ignore"
                  ) as f:
                      raw = f.read()

              except Exception as e:
                  print(
                      f"Failed reading {filename}: {e}"
                  )
                  continue

              lines = decode_subscription(raw)

              for line in lines:
                  uri = line.strip()

                  if not uri:
                      continue

                  protocol = get_protocol(uri)

                  if protocol is None:
                      continue

                  # Remove accidental whitespace.
                  uri = uri.replace(
                      "\r",
                      ""
                  ).replace(
                      "\n",
                      ""
                  )

                  # Remove duplicate configurations.
                  if uri in seen[protocol]:
                      continue

                  seen[protocol].add(uri)

                  pools[protocol].append({
                      "config": uri,
                      "countryCode": country,
                  })

          print("")
          print("Available unique servers:")
          print(
              f"Shadowsocks : {len(pools['ss'])}"
          )
          print(
              f"Hysteria2   : {len(pools['hysteria2'])}"
          )
          print(
              f"Trojan      : {len(pools['trojan'])}"
          )
          print(
              f"VLESS       : {len(pools['vless'])}"
          )
          print("")

          # Make sure every protocol has at least 20.
          for protocol, required in TARGETS.items():

              available = len(
                  pools[protocol]
              )

              if available < required:
                  raise SystemExit(
                      f"Not enough {protocol} servers: "
                      f"{available}/{required}"
                  )

          result = []

          # Select exactly 20 from each protocol.
          for protocol in (
              "ss",
              "hysteria2",
              "trojan",
              "vless",
          ):

              selected = pools[protocol][:20]

              # Number servers by country.
              counters = {}

              for item in selected:

                  country = item[
                      "countryCode"
                  ].lower()

                  counters[country] = (
                      counters.get(country, 0) + 1
                  )

                  number = counters[country]

                  country_name = COUNTRY_NAMES.get(
                      country,
                      country.upper()
                  )

                  # IMPORTANT:
                  # Do NOT use the name from the URI.
                  # Always create the name from countryCode.
                  server_name = (
                      f"{country_name} {number}"
                  )

                  result.append({
                      "name": server_name,
                      "config": item["config"],
                      "countryCode": country,
                  })

          # Final validation.
          if len(result) != 80:
              raise SystemExit(
                  f"Expected 80 servers, "
                  f"got {len(result)}"
              )

          protocol_counts = {
              "ss": 0,
              "hysteria2": 0,
              "trojan": 0,
              "vless": 0,
          }

          for item in result:
              protocol = get_protocol(
                  item["config"]
              )

              if protocol:
                  protocol_counts[
                      protocol
                  ] += 1

          print("Final distribution:")
          print(
              json.dumps(
                  protocol_counts,
                  indent=2
              )
          )

          # Make sure it is exactly 20 each.
          for protocol in TARGETS:

              if (
                  protocol_counts[protocol]
                  != 20
              ):
                  raise SystemExit(
                      f"Invalid {protocol} count: "
                      f"{protocol_counts[protocol]}"
                  )

          # Write JSON.
          with open(
              OUTPUT,
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  result,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

              f.write("\n")

          print("")
          print(
              f"Created {OUTPUT}"
          )
          print(
              f"Total servers: {len(result)}"
          )
          PY

      - name: Show generated JSON
        run: |
          echo "================ services.json ================"
          cat services.json
          echo "================================================"

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add services.json

          if git diff --cached --quiet; then
            echo "No changes detected."
            exit 0
          fi

          git commit -m "Update mixed VPN servers"

      - name: Rebase and push
        shell: bash
        run: |
          set -e

          for i in {1..5}; do

            echo "Push attempt $i..."

            git fetch origin main

            if git rebase origin/main; then

              if git push origin HEAD:main; then
                echo "Push successful."
                exit 0
              fi

            else
              git rebase --abort || true
            fi

            echo "Push failed. Retrying..."
            sleep 5

          done

          echo "Failed to push after 5 attempts."

          exit 1
