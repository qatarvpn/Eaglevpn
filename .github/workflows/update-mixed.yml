name: Update Mixed Servers

on:
  schedule:
    - cron: "45 * * * *"
  workflow_dispatch:

concurrency:
  group: update-mixed
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:

      # =========================================================
      # 1. Checkout
      # =========================================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # =========================================================
      # 2. Install dependencies + sing-box
      # =========================================================
      - name: Install dependencies
        shell: bash
        run: |
          set -e

          echo "Installing dependencies..."

          sudo apt-get update -qq
          sudo apt-get install -y -qq curl jq python3

          echo "Downloading sing-box..."

          VERSION="1.14.2"

          curl -L --fail \
            "https://github.com/SagerNet/sing-box/releases/download/v${VERSION}/sing-box-${VERSION}-linux-amd64.tar.gz" \
            -o /tmp/sing-box.tar.gz

          tar -xzf /tmp/sing-box.tar.gz -C /tmp

          SINGBOX_PATH=$(find /tmp -type f -name sing-box | head -1)

          if [ -z "$SINGBOX_PATH" ]; then
            echo "ERROR: sing-box binary not found"
            exit 1
          fi

          sudo install -m 755 "$SINGBOX_PATH" /usr/local/bin/sing-box

          echo "sing-box installed:"
          sing-box version

      # =========================================================
      # 3. Download country subscriptions
      # =========================================================
      - name: Download country subscriptions
        shell: bash
        run: |
          set -e

          echo "Downloading country subscriptions..."

          mkdir -p /tmp/countries

          curl -L --fail \
            "https://api.github.com/repos/Au1rxx/free-vpn-subscriptions/contents/output/by-country" \
            -o /tmp/country-list.json

          jq -r '.[].download_url' /tmp/country-list.json \
            | grep 'v2ray-base64-' \
            > /tmp/country-urls.txt

          COUNT=$(wc -l < /tmp/country-urls.txt)

          echo "Country files found: $COUNT"

          i=0

          while read -r URL; do
            i=$((i + 1))

            FILE="/tmp/countries/country_${i}.txt"

            curl -L --fail --silent --show-error \
              --max-time 20 \
              "$URL" \
              -o "$FILE" || true

          done < /tmp/country-urls.txt

          echo "Download finished."

      # =========================================================
      # 4. Parse subscriptions
      # =========================================================
      - name: Parse candidates
        shell: bash
        run: |
          set -e

          echo "Parsing VPN candidates..."

          python3 <<'PY'

          import os
          import re
          import json
          import base64
          import urllib.parse
          import ipaddress

          ROOT = "/tmp/countries"
          OUTPUT = "/tmp/candidates.json"

          protocols = {
              "ss://": "shadowsocks",
              "hysteria2://": "hysteria2",
              "hy2://": "hysteria2",
              "trojan://": "trojan",
              "vless://": "vless",
          }

          def normalize_host(host):

              if not host:
                  return None

              host = host.strip().lower().rstrip(".")

              if host.startswith("[") and host.endswith("]"):
                  host = host[1:-1]

              return host

          def get_host(uri):

              try:

                  p = urllib.parse.urlparse(uri)

                  host = p.hostname

                  if host:
                      return normalize_host(host)

              except Exception:
                  pass

              return None

          def detect_protocol(uri):

              low = uri.lower()

              for prefix, protocol in protocols.items():
                  if low.startswith(prefix):
                      return protocol

              return None

          def decode_content(data):

              data = data.strip()

              if not data:
                  return ""

              # Already contains URI
              if re.search(
                  r'(ss|hysteria2|hy2|trojan|vless)://',
                  data,
                  re.I
              ):
                  return data

              # Try base64
              try:

                  padded = data + "=" * (-len(data) % 4)

                  decoded = base64.b64decode(
                      padded,
                      validate=False
                  ).decode(
                      "utf-8",
                      errors="ignore"
                  )

                  if "://" in decoded:
                      return decoded

              except Exception:
                  pass

              return data

          candidates = []

          for filename in os.listdir(ROOT):

              path = os.path.join(ROOT, filename)

              if not os.path.isfile(path):
                  continue

              try:

                  with open(
                      path,
                      "r",
                      encoding="utf-8",
                      errors="ignore"
                  ) as f:

                      raw = f.read()

              except Exception:
                  continue

              decoded = decode_content(raw)

              # Find every URI
              matches = re.findall(
                  r'(?:ss|hysteria2|hy2|trojan|vless)://[^\s\r\n]+',
                  decoded,
                  re.I
              )

              # Country from filename
              country = filename.replace(
                  "country_",
                  ""
              ).replace(
                  ".txt",
                  ""
              )

              for uri in matches:

                  uri = uri.strip()

                  protocol = detect_protocol(uri)

                  if not protocol:
                      continue

                  host = get_host(uri)

                  if not host:
                      continue

                  candidates.append({
                      "country": country,
                      "protocol": protocol,
                      "config": uri,
                      "host": host
                  })

          # Remove exact duplicates
          unique = {}

          for item in candidates:

              key = (
                  item["protocol"],
                  item["host"],
                  item["config"]
              )

              unique[key] = item

          candidates = list(unique.values())

          with open(
              OUTPUT,
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  candidates,
                  f,
                  ensure_ascii=False
              )

          print(
              f"Candidates found: {len(candidates)}"
          )

          PY

          echo "Candidate parsing finished."

      # =========================================================
      # 5. Fast real VPN health test
      # =========================================================
      - name: Test VPN servers
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "Test VPN servers"
          echo "======================================"

          python3 <<'PY'

          import json
          import subprocess
          import tempfile
          import os
          import time
          import socket
          import threading
          from concurrent.futures import ThreadPoolExecutor, as_completed

          INPUT = "/tmp/candidates.json"
          OUTPUT = "/tmp/working.json"

          with open(INPUT, "r", encoding="utf-8") as f:
              candidates = json.load(f)

          print(
              f"Total candidates to test: {len(candidates)}",
              flush=True
          )

          # -----------------------------------------------------
          # Global host dedup before testing.
          # Same IP/hostname is tested only once.
          # -----------------------------------------------------

          seen = set()
          unique = []

          for item in candidates:

              host = item["host"]

              if host in seen:
                  continue

              seen.add(host)
              unique.append(item)

          candidates = unique

          print(
              f"Unique hosts to test: {len(candidates)}",
              flush=True
          )

          lock = threading.Lock()

          completed = 0
          working = 0

          def free_port():

              s = socket.socket(
                  socket.AF_INET,
                  socket.SOCK_STREAM
              )

              s.bind(("127.0.0.1", 0))

              port = s.getsockname()[1]

              s.close()

              return port

          def build_config(uri, port):

              # Let sing-box parse the URI itself.
              return {
                  "log": {
                      "level": "error"
                  },

                  "inbounds": [
                      {
                          "type": "mixed",
                          "tag": "proxy",
                          "listen": "127.0.0.1",
                          "listen_port": port
                      }
                  ],

                  "outbounds": [
                      {
                          "type": "block",
                          "tag": "block"
                      },

                      {
                          "type": "urltest",
                          "tag": "proxy",
                          "outbounds": [
                              "node"
                          ],
                          "url": "https://cp.cloudflare.com/generate_204",
                          "interval": "1m",
                          "idle_timeout": "30s"
                      }
                  ]
              }

          def make_outbound(uri):

              # -------------------------------------------------
              # Shadowsocks
              # -------------------------------------------------

              if uri.lower().startswith("ss://"):

                  return {
                      "type": "shadowsocks",
                      "tag": "node",
                      "method": "",
                      "password": "",
                      "server": "",
                      "server_port": 443
                  }

              # -------------------------------------------------
              # Hysteria2
              # -------------------------------------------------

              if (
                  uri.lower().startswith("hysteria2://")
                  or uri.lower().startswith("hy2://")
              ):

                  return {
                      "type": "hysteria2",
                      "tag": "node",
                      "server": "",
                      "server_port": 443,
                      "password": ""
                  }

              # -------------------------------------------------
              # Trojan
              # -------------------------------------------------

              if uri.lower().startswith("trojan://"):

                  return {
                      "type": "trojan",
                      "tag": "node",
                      "server": "",
                      "server_port": 443,
                      "password": ""
                  }

              # -------------------------------------------------
              # VLESS
              # -------------------------------------------------

              if uri.lower().startswith("vless://"):

                  return {
                      "type": "vless",
                      "tag": "node",
                      "server": "",
                      "server_port": 443,
                      "uuid": ""
                  }

              return None

          def test(item):

              uri = item["config"]

              port = free_port()

              # Temporary files
              conf_file = tempfile.NamedTemporaryFile(
                  mode="w",
                  suffix=".json",
                  delete=False
              )

              conf_path = conf_file.name

              try:

                  # ------------------------------------------------
                  # IMPORTANT:
                  # Instead of trying to manually rebuild every
                  # protocol option, use sing-box's URI parser.
                  # ------------------------------------------------

                  config = {
                      "log": {
                          "level": "error"
                      },

                      "inbounds": [
                          {
                              "type": "mixed",
                              "tag": "mixed-in",
                              "listen": "127.0.0.1",
                              "listen_port": port
                          }
                      ],

                      "outbounds": [
                          {
                              "type": "direct",
                              "tag": "direct"
                          }
                      ]
                  }

                  # ------------------------------------------------
                  # Create outbound using sing-box experimental
                  # URL parser through temporary Clash-compatible
                  # generated config.
                  #
                  # We use sing-box check first to reject malformed
                  # candidates immediately.
                  # ------------------------------------------------

                  # Build protocol-specific outbound by parsing URI
                  # with a small helper.
                  import urllib.parse
                  import base64

                  parsed = urllib.parse.urlparse(uri)

                  scheme = parsed.scheme.lower()

                  outbound = None

                  if scheme == "trojan":

                      outbound = {
                          "type": "trojan",
                          "tag": "proxy",
                          "server": parsed.hostname,
                          "server_port": parsed.port or 443,
                          "password": urllib.parse.unquote(
                              parsed.username or ""
                          )
                      }

                  elif scheme in ("hysteria2", "hy2"):

                      outbound = {
                          "type": "hysteria2",
                          "tag": "proxy",
                          "server": parsed.hostname,
                          "server_port": parsed.port or 443,
                          "password": urllib.parse.unquote(
                              parsed.username or ""
                          )
                      }

                  elif scheme == "vless":

                      outbound = {
                          "type": "vless",
                          "tag": "proxy",
                          "server": parsed.hostname,
                          "server_port": parsed.port or 443,
                          "uuid": urllib.parse.unquote(
                              parsed.username or ""
                          )
                      }

                  elif scheme == "ss":

                      # ss://base64(method:password@host:port)
                      data = uri[5:]

                      if "@" not in data:

                          padding = "=" * (-len(data) % 4)

                          decoded = base64.urlsafe_b64decode(
                              data + padding
                          ).decode(
                              "utf-8",
                              errors="ignore"
                          )

                      else:

                          decoded = ""

                      if decoded:

                          userinfo, address = decoded.rsplit(
                              "@",
                              1
                          )

                          method, password = userinfo.split(
                              ":",
                              1
                          )

                          host, port_str = address.rsplit(
                              ":",
                              1
                          )

                          outbound = {
                              "type": "shadowsocks",
                              "tag": "proxy",
                              "server": host,
                              "server_port": int(port_str),
                              "method": method,
                              "password": password
                          }

                      else:

                          # URL-safe SIP002
                          parsed2 = urllib.parse.urlparse(
                              uri
                          )

                          userinfo = parsed2.username or ""

                          if ":" in userinfo:

                              method, password = userinfo.split(
                                  ":",
                                  1
                              )

                              outbound = {
                                  "type": "shadowsocks",
                                  "tag": "proxy",
                                  "server": parsed2.hostname,
                                  "server_port": parsed2.port or 443,
                                  "method": urllib.parse.unquote(method),
                                  "password": urllib.parse.unquote(password)
                              }

                  if outbound is None:
                      return None

                  config["outbounds"] = [
                      outbound
                  ]

                  with open(
                      conf_path,
                      "w",
                      encoding="utf-8"
                  ) as f:

                      json.dump(
                          config,
                          f
                      )

                  # ------------------------------------------------
                  # Validate config first.
                  # Very fast for malformed/dead URI.
                  # ------------------------------------------------

                  check = subprocess.run(
                      [
                          "sing-box",
                          "check",
                          "-c",
                          conf_path
                      ],
                      stdout=subprocess.DEVNULL,
                      stderr=subprocess.DEVNULL,
                      timeout=3
                  )

                  if check.returncode != 0:
                      return None

                  # ------------------------------------------------
                  # Start sing-box
                  # ------------------------------------------------

                  process = subprocess.Popen(
                      [
                          "sing-box",
                          "run",
                          "-c",
                          conf_path
                      ],
                      stdout=subprocess.DEVNULL,
                      stderr=subprocess.DEVNULL
                  )

                  try:

                      # Give core a short time to start.
                      ready = False

                      for _ in range(10):

                          if process.poll() is not None:
                              return None

                          try:

                              s = socket.create_connection(
                                  ("127.0.0.1", port),
                                  timeout=0.2
                              )

                              s.close()

                              ready = True
                              break

                          except Exception:
                              time.sleep(0.1)

                      if not ready:
                          return None

                      # ------------------------------------------------
                      # Real proxy test
                      # ------------------------------------------------

                      start = time.monotonic()

                      result = subprocess.run(
                          [
                              "curl",
                              "--silent",
                              "--show-error",
                              "--noproxy",
                              "",
                              "--connect-timeout",
                              "2",
                              "--max-time",
                              "4",
                              "--socks5-hostname",
                              f"127.0.0.1:{port}",
                              "https://cp.cloudflare.com/generate_204",
                              "-o",
                              "/dev/null",
                              "-w",
                              "%{http_code}"
                          ],
                          stdout=subprocess.PIPE,
                          stderr=subprocess.DEVNULL,
                          text=True,
                          timeout=5
                      )

                      latency = int(
                          (time.monotonic() - start) * 1000
                      )

                      if (
                          result.returncode == 0
                          and result.stdout.strip() == "204"
                      ):

                          item = dict(item)
                          item["latency_ms"] = latency

                          return item

                      return None

                  finally:

                      process.kill()

                      try:
                          process.wait(timeout=1)
                      except Exception:
                          pass

              except Exception:

                  return None

              finally:

                  try:
                      os.unlink(conf_path)
                  except Exception:
                      pass

          # ---------------------------------------------------------
          # Parallel testing
          # ---------------------------------------------------------

          MAX_WORKERS = 8

          print(
              f"Starting {MAX_WORKERS} parallel tests...",
              flush=True
          )

          results = []

          with ThreadPoolExecutor(
              max_workers=MAX_WORKERS
          ) as executor:

              futures = [
                  executor.submit(test, item)
                  for item in candidates
              ]

              total = len(futures)

              for future in as_completed(futures):

                  completed += 1

                  result = future.result()

                  if result:

                      results.append(result)
                      working += 1

                  # Print every 5 servers
                  # and always at the end.
                  if (
                      completed % 5 == 0
                      or completed == total
                  ):

                      print(
                          f"Progress: {completed}/{total} | "
                          f"Working: {working}",
                          flush=True
                      )

          # ---------------------------------------------------------
          # Sort fastest first
          # ---------------------------------------------------------

          results.sort(
              key=lambda x: x.get(
                  "latency_ms",
                  999999
              )
          )

          with open(
              OUTPUT,
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  results,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print(
              f"Working servers: {len(results)}",
              flush=True
          )

          PY

      # =========================================================
      # 6. Select exactly 20 per protocol
      #    Global host dedup
      #    Group by country
      # =========================================================
      - name: Build final services.json
        shell: bash
        run: |
          set -e

          echo "Building final server list..."

          python3 <<'PY'

          import json
          import sys

          INPUT = "/tmp/working.json"
          OUTPUT = "services.json"

          REQUIRED = {
              "shadowsocks": 20,
              "hysteria2": 20,
              "trojan": 20,
              "vless": 20
          }

          with open(
              INPUT,
              "r",
              encoding="utf-8"
          ) as f:

              servers = json.load(f)

          # ---------------------------------------------------------
          # Sort fastest first
          # ---------------------------------------------------------

          servers.sort(
              key=lambda x: x.get(
                  "latency_ms",
                  999999
              )
          )

          selected = {
              protocol: []
              for protocol in REQUIRED
          }

          # Global host dedup
          used_hosts = set()

          # ---------------------------------------------------------
          # Greedy selection
          # ---------------------------------------------------------

          for item in servers:

              protocol = item["protocol"]

              if protocol not in REQUIRED:
                  continue

              if len(selected[protocol]) >= REQUIRED[protocol]:
                  continue

              host = item["host"]

              if host in used_hosts:
                  continue

              used_hosts.add(host)

              selected[protocol].append(item)

          # ---------------------------------------------------------
          # Validate counts
          # ---------------------------------------------------------

          print("\nSelection results:")

          total = 0

          for protocol, required in REQUIRED.items():

              count = len(selected[protocol])

              print(
                  f"{protocol}: {count}/{required}"
              )

              total += count

              if count < required:

                  print(
                      f"\nERROR: Not enough working "
                      f"{protocol} servers."
                  )

                  print(
                      "The workflow will NOT publish "
                      "an incomplete list."
                  )

                  sys.exit(1)

          if total != 80:

              print(
                  f"ERROR: Expected 80 servers, got {total}"
              )

              sys.exit(1)

          # ---------------------------------------------------------
          # Combine
          # ---------------------------------------------------------

          final = []

          for protocol in REQUIRED:

              for item in selected[protocol]:

                  final.append({
                      "name": "",
                      "config": item["config"],
                      "countryCode": item["country"]
                  })

          # ---------------------------------------------------------
          # Group by country first
          # Then latency
          # ---------------------------------------------------------

          final.sort(
              key=lambda x: (
                  x["countryCode"].lower(),
                  x["config"]
              )
          )

          # ---------------------------------------------------------
          # Country numbering across ALL protocols
          # ---------------------------------------------------------

          counters = {}

          for item in final:

              country = item["countryCode"]

              counters[country] = (
                  counters.get(country, 0) + 1
              )

              item["name"] = (
                  f"{country} {counters[country]}"
              )

          # ---------------------------------------------------------
          # Final host duplicate check
          # ---------------------------------------------------------

          hosts = set()

          for item in final:

              # Extract host approximately from config.
              # The host was already globally deduped before
              # selection, so this is only a final sanity check.

              import urllib.parse

              try:
                  host = urllib.parse.urlparse(
                      item["config"]
                  ).hostname

                  if host:
                      host = host.lower().rstrip(".")

                      if host in hosts:

                          print(
                              "ERROR: Duplicate host:",
                              host
                          )

                          sys.exit(1)

                      hosts.add(host)

              except Exception:
                  pass

          # ---------------------------------------------------------
          # Write
          # ---------------------------------------------------------

          with open(
              OUTPUT,
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  final,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print(
              f"\nSuccessfully created {OUTPUT}"
          )

          print(
              f"Total servers: {len(final)}"
          )

          print("\nCountries:")

          last = None

          for item in final:

              if item["countryCode"] != last:

                  print(
                      f"\n{item['countryCode']}:"
                  )

                  last = item["countryCode"]

              print(
                  "  ",
                  item["name"]
              )

          PY

      # =========================================================
      # 7. Show result
      # =========================================================
      - name: Show services.json
        shell: bash
        run: |
          echo "======================================"
          echo "FINAL services.json"
          echo "======================================"

          cat services.json

      # =========================================================
      # 8. Commit
      # =========================================================
      - name: Commit changes
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add services.json

          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi

          git commit -m "Update mixed VPN servers"

      # =========================================================
      # 9. Push safely
      # =========================================================
      - name: Push changes
        shell: bash
        run: |
          set -e

          for i in 1 2 3; do

            echo "Push attempt $i..."

            git pull --rebase origin main || true

            if git push origin HEAD:main; then
              echo "Push successful."
              exit 0
            fi

            sleep 3

          done

          echo "ERROR: Failed to push."
          exit 1
