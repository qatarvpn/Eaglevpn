name: Update Mixed VPN Servers

on:
  schedule:
    - cron: "45 * * * *"
  workflow_dispatch:

concurrency:
  group: update-mixed
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download country subscriptions
        shell: bash
        run: |
          set -e

          mkdir -p /tmp/vpn_sources

          echo "Fetching country files..."

          curl -fsSL \
            "https://api.github.com/repos/Au1rxx/free-vpn-subscriptions/contents/output/by-country" \
            -o /tmp/files.json

          python - <<'PY'
          import json
          import os
          import urllib.request

          API_FILE = "/tmp/files.json"
          OUT_DIR = "/tmp/vpn_sources"

          with open(API_FILE, "r", encoding="utf-8") as f:
              files = json.load(f)

          downloaded = 0

          for item in files:
              filename = item.get("name", "")

              if not filename.startswith("v2ray-base64-"):
                  continue

              if not filename.endswith(".txt"):
                  continue

              country = filename[
                  len("v2ray-base64-"):
                  -len(".txt")
              ].lower()

              if not country:
                  continue

              url = item.get("download_url")

              if not url:
                  continue

              output = os.path.join(
                  OUT_DIR,
                  f"{country}.txt"
              )

              print(f"Downloading: {filename}")

              urllib.request.urlretrieve(
                  url,
                  output
              )

              downloaded += 1

          print(f"Downloaded {downloaded} country files.")

          if downloaded == 0:
              raise SystemExit(
                  "No country subscription files found."
              )
          PY

      - name: Generate services.json
        shell: bash
        run: |
          set -e

          python - <<'PY'
          import base64
          import ipaddress
          import json
          import os
          import re
          from urllib.parse import urlsplit

          SOURCE_DIR = "/tmp/vpn_sources"
          OUTPUT = "services.json"

          # Exactly 20 servers from each protocol.
          TARGETS = {
              "ss": 20,
              "hysteria2": 20,
              "trojan": 20,
              "vless": 20,
          }

          COUNTRY_NAMES = {
              "us": "United States",
              "gb": "United Kingdom",
              "ca": "Canada",
              "de": "Germany",
              "fr": "France",
              "nl": "Netherlands",
              "jp": "Japan",
              "sg": "Singapore",
              "hk": "Hong Kong",
              "kr": "South Korea",
              "tw": "Taiwan",
              "in": "India",
              "ae": "United Arab Emirates",
              "au": "Australia",
              "es": "Spain",
              "it": "Italy",
              "pl": "Poland",
              "se": "Sweden",
              "fi": "Finland",
              "ro": "Romania",
              "id": "Indonesia",
              "my": "Malaysia",
              "th": "Thailand",
              "vn": "Vietnam",
              "br": "Brazil",
              "mx": "Mexico",
              "ch": "Switzerland",
              "at": "Austria",
              "be": "Belgium",
              "dk": "Denmark",
              "no": "Norway",
              "cz": "Czech Republic",
              "ua": "Ukraine",
              "tr": "Turkey",
              "ru": "Russia",
              "il": "Israel",
              "za": "South Africa",
              "pt": "Portugal",
              "gr": "Greece",
              "ie": "Ireland",
              "nz": "New Zealand",
              "ph": "Philippines",
              "pk": "Pakistan",
              "bd": "Bangladesh",
              "ar": "Argentina",
              "cl": "Chile",
              "co": "Colombia",
              "pe": "Peru",
          }

          def decode_subscription(text):
              text = text.strip()

              if not text:
                  return []

              plain_lines = [
                  line.strip()
                  for line in text.splitlines()
                  if line.strip()
              ]

              if any(
                  line.lower().startswith(
                      (
                          "ss://",
                          "hysteria2://",
                          "hy2://",
                          "trojan://",
                          "vless://",
                      )
                  )
                  for line in plain_lines
              ):
                  return plain_lines

              compact = re.sub(
                  r"\s+",
                  "",
                  text
              )

              try:
                  padding = "=" * (-len(compact) % 4)

                  decoded = base64.b64decode(
                      compact + padding,
                      validate=False
                  ).decode(
                      "utf-8",
                      errors="ignore"
                  )

                  lines = [
                      line.strip()
                      for line in decoded.splitlines()
                      if line.strip()
                  ]

                  if lines:
                      return lines

              except Exception:
                  pass

              try:
                  padding = "=" * (-len(compact) % 4)

                  decoded = base64.urlsafe_b64decode(
                      compact + padding
                  ).decode(
                      "utf-8",
                      errors="ignore"
                  )

                  return [
                      line.strip()
                      for line in decoded.splitlines()
                      if line.strip()
                  ]

              except Exception:
                  return []

          def get_protocol(uri):
              lower = uri.lower()

              if lower.startswith("ss://"):
                  return "ss"

              if (
                  lower.startswith("hysteria2://")
                  or lower.startswith("hy2://")
              ):
                  return "hysteria2"

              if lower.startswith("trojan://"):
                  return "trojan"

              if lower.startswith("vless://"):
                  return "vless"

              return None

          def normalize_host(host):
              """
              Normalize IPs and hostnames so the same server
              cannot appear more than once.
              """

              if not host:
                  return None

              host = str(host).strip()

              # Remove brackets around IPv6.
              if (
                  host.startswith("[")
                  and host.endswith("]")
              ):
                  host = host[1:-1]

              # Remove trailing dot from hostname.
              host = host.rstrip(".")

              if not host:
                  return None

              # Normalize IP addresses.
              try:
                  ip = ipaddress.ip_address(host)
                  return str(ip)
              except ValueError:
                  pass

              # Normalize hostname.
              host = host.lower()

              # Basic cleanup.
              host = host.rstrip(".")

              return host

          def decode_ss_host(uri):
              """
              Handles common Shadowsocks URI formats.

              Format:
              ss://BASE64@host:port
              """

              try:
                  parsed = urlsplit(uri)

                  if parsed.hostname:
                      return parsed.hostname

                  # Some SS links may contain the entire
                  # userinfo/endpoint inside Base64.
                  netloc = parsed.netloc

                  if "@" not in netloc:
                      return None

                  encoded = netloc.split("@", 1)[0]

                  padding = "=" * (-len(encoded) % 4)

                  decoded = base64.urlsafe_b64decode(
                      encoded + padding
                  ).decode(
                      "utf-8",
                      errors="ignore"
                  )

                  if "@" in decoded:
                      endpoint = decoded.rsplit("@", 1)[1]

                      if ":" in endpoint:
                          host = endpoint.rsplit(":", 1)[0]
                          return host

              except Exception:
                  pass

              return None

          def get_server_host(uri):
              """
              Extract the server IP/hostname from all
              supported protocols.
              """

              protocol = get_protocol(uri)

              if protocol == "ss":
                  host = decode_ss_host(uri)

                  if host:
                      return normalize_host(host)

                  return None

              try:
                  parsed = urlsplit(uri)

                  host = parsed.hostname

                  if host:
                      return normalize_host(host)

              except Exception:
                  pass

              return None

          # Pools for every protocol.
          pools = {
              "ss": [],
              "hysteria2": [],
              "trojan": [],
              "vless": [],
          }

          # Prevent duplicate complete configurations
          # inside each protocol.
          seen_configs = {
              "ss": set(),
              "hysteria2": set(),
              "trojan": set(),
              "vless": set(),
          }

          files = sorted(
              filename
              for filename in os.listdir(SOURCE_DIR)
              if filename.endswith(".txt")
          )

          print(f"Found {len(files)} country files.")

          invalid_hosts = 0
          duplicate_configs = 0

          for filename in files:
              country = filename[:-4].lower()

              path = os.path.join(
                  SOURCE_DIR,
                  filename
              )

              try:
                  with open(
                      path,
                      "r",
                      encoding="utf-8",
                      errors="ignore"
                  ) as f:
                      raw = f.read()

              except Exception as e:
                  print(
                      f"Failed reading {filename}: {e}"
                  )
                  continue

              lines = decode_subscription(raw)

              for line in lines:
                  uri = line.strip()

                  if not uri:
                      continue

                  protocol = get_protocol(uri)

                  if protocol is None:
                      continue

                  uri = uri.replace(
                      "\r",
                      ""
                  ).replace(
                      "\n",
                      ""
                  )

                  # Remove exact duplicate configuration.
                  if uri in seen_configs[protocol]:
                      duplicate_configs += 1
                      continue

                  host = get_server_host(uri)

                  if not host:
                      invalid_hosts += 1
                      print(
                          f"Skipping URI without valid host: {uri[:100]}"
                      )
                      continue

                  seen_configs[protocol].add(uri)

                  pools[protocol].append({
                      "config": uri,
                      "countryCode": country,
                      "host": host,
                  })

          print("")
          print("==============================")
          print("Available configurations:")
          print(
              f"Shadowsocks : {len(pools['ss'])}"
          )
          print(
              f"Hysteria2   : {len(pools['hysteria2'])}"
          )
          print(
              f"Trojan      : {len(pools['trojan'])}"
          )
          print(
              f"VLESS       : {len(pools['vless'])}"
          )
          print(
              f"Duplicate configs skipped: {duplicate_configs}"
          )
          print(
              f"Invalid hosts skipped: {invalid_hosts}"
          )
          print("==============================")
          print("")

          # -------------------------------------------------
          # Count how many protocols contain each host.
          #
          # This helps preserve hosts that are available in
          # only one protocol, preventing one protocol from
          # consuming hosts needed by another protocol.
          # -------------------------------------------------

          host_protocols = {}

          for protocol, items in pools.items():
              for item in items:
                  host = item["host"]

                  if host not in host_protocols:
                      host_protocols[host] = set()

                  host_protocols[host].add(protocol)

          # Prefer hosts that occur in fewer protocols first.
          for protocol in pools:
              pools[protocol].sort(
                  key=lambda item: (
                      len(
                          host_protocols[
                              item["host"]
                          ]
                      ),
                      item["host"],
                      item["countryCode"],
                      item["config"],
                  )
              )

          # -------------------------------------------------
          # GLOBAL HOST DEDUPLICATION
          #
          # One IP/hostname can only appear once across
          # ALL four protocols.
          # -------------------------------------------------

          seen_hosts = set()

          selected = {
              "ss": [],
              "hysteria2": [],
              "trojan": [],
              "vless": [],
          }

          duplicate_hosts = 0

          # Select exactly 20 from every protocol.
          for protocol in (
              "ss",
              "hysteria2",
              "trojan",
              "vless",
          ):

              for item in pools[protocol]:

                  if len(
                      selected[protocol]
                  ) >= TARGETS[protocol]:
                      break

                  host = item["host"]

                  # GLOBAL duplicate check.
                  if host in seen_hosts:
                      duplicate_hosts += 1

                      print(
                          f"Skipping duplicate host "
                          f"for {protocol}: {host}"
                      )

                      continue

                  seen_hosts.add(host)

                  selected[protocol].append(item)

              count = len(
                  selected[protocol]
              )

              if count < TARGETS[protocol]:
                  raise SystemExit(
                      f"Not enough unique {protocol} "
                      f"servers after global host "
                      f"deduplication: "
                      f"{count}/{TARGETS[protocol]}"
                  )

          print("")
          print("==============================")
          print("Selected servers:")
          print(
              f"Shadowsocks : {len(selected['ss'])}"
          )
          print(
              f"Hysteria2   : {len(selected['hysteria2'])}"
          )
          print(
              f"Trojan      : {len(selected['trojan'])}"
          )
          print(
              f"VLESS       : {len(selected['vless'])}"
          )
          print(
              f"Duplicate hosts skipped: {duplicate_hosts}"
          )
          print(
              f"Unique hosts selected: {len(seen_hosts)}"
          )
          print("==============================")
          print("")

          result = []

          # -------------------------------------------------
          # Build final JSON.
          # -------------------------------------------------

          for protocol in (
              "ss",
              "hysteria2",
              "trojan",
              "vless",
          ):

              counters = {}

              for item in selected[protocol]:

                  country = item[
                      "countryCode"
                  ].lower()

                  counters[country] = (
                      counters.get(country, 0) + 1
                  )

                  number = counters[country]

                  country_name = COUNTRY_NAMES.get(
                      country,
                      country.upper()
                  )

                  server_name = (
                      f"{country_name} {number}"
                  )

                  result.append({
                      "name": server_name,
                      "config": item["config"],
                      "countryCode": country,
                  })

          # -------------------------------------------------
          # Final validation.
          # -------------------------------------------------

          if len(result) != 80:
              raise SystemExit(
                  f"Expected 80 servers, "
                  f"got {len(result)}"
              )

          # Verify there are absolutely no duplicate
          # IPs/hostnames in the final result.
          final_hosts = set()

          for item in result:

              host = get_server_host(
                  item["config"]
              )

              if not host:
                  raise SystemExit(
                      "Final server has no valid host."
                  )

              if host in final_hosts:
                  raise SystemExit(
                      f"FINAL DUPLICATE HOST FOUND: {host}"
                  )

              final_hosts.add(host)

          protocol_counts = {
              "ss": 0,
              "hysteria2": 0,
              "trojan": 0,
              "vless": 0,
          }

          for item in result:

              protocol = get_protocol(
                  item["config"]
              )

              if protocol:
                  protocol_counts[
                      protocol
                  ] += 1

          print("Final distribution:")
          print(
              json.dumps(
                  protocol_counts,
                  indent=2
              )
          )

          print(
              f"Final unique hosts: "
              f"{len(final_hosts)}"
          )

          # Exactly 20 each.
          for protocol in TARGETS:

              if (
                  protocol_counts[protocol]
                  != 20
              ):
                  raise SystemExit(
                      f"Invalid {protocol} count: "
                      f"{protocol_counts[protocol]}"
                  )

          if len(final_hosts) != 80:
              raise SystemExit(
                  f"Expected 80 unique hosts, "
                  f"got {len(final_hosts)}"
              )

          # -------------------------------------------------
          # Write JSON.
          # -------------------------------------------------

          with open(
              OUTPUT,
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  result,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

              f.write("\n")

          print("")
          print(
              f"Created {OUTPUT}"
          )
          print(
              f"Total servers: {len(result)}"
          )
          print(
              "All 80 servers have unique IP/host."
          )
          PY

      - name: Show generated JSON
        run: |
          echo "================ services.json ================"
          cat services.json
          echo "================================================"

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add services.json

          if git diff --cached --quiet; then
            echo "No changes detected."
            exit 0
          fi

          git commit -m "Update mixed VPN servers"

      - name: Rebase and push
        shell: bash
        run: |
          set -e

          for i in {1..5}; do

            echo "Push attempt $i..."

            git fetch origin main

            if git rebase origin/main; then

              if git push origin HEAD:main; then
                echo "Push successful."
                exit 0
              fi

            else
              git rebase --abort || true
            fi

            echo "Push failed. Retrying..."
            sleep 5

          done

          echo "Failed to push after 5 attempts."

          exit 1
